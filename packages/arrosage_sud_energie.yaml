# ═══════════════════════════════════════════════════════════════════════════
#  ARROSAGE SUD — Compteur d'eau pour le DASHBOARD ÉNERGIE (uniquement)
#  Vanne Zigbee SONOFF SWV « Arrosage SUD » (même modèle que l'EST).
#  PAS de pilotage / PAS d'arrosage automatique ici — juste la mesure de conso
#  d'eau, exposée en m³ (device_class water, total_increasing) pour la section
#  Eau du dashboard Énergie. Réplique le montage de arrosage_est.yaml.
#
#  Entité source : sensor.arrosage_sud_daily_irrigation_volume (L, reset minuit).
# ═══════════════════════════════════════════════════════════════════════════

input_number:
  # Compteur d'eau TOTAL cumulatif (persistant, ne fait qu'augmenter), en litres.
  arrosage_sud_eau_totale:
    name: 💧 Arrosage SUD — eau totale cumulée
    icon: mdi:counter
    min: 0
    max: 100000000
    step: 0.001
    unit_of_measurement: L
    mode: box

automation:
  # Accumule chaque incrément du volume journalier dans le total cumulé.
  # (Mécanique du compteur — ce n'est PAS un pilotage d'arrosage.)
  - id: arrosage_sud_compteur_total
    alias: 💧 Arrosage SUD — incrément compteur eau total
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.arrosage_sud_daily_irrigation_volume
    condition:
      - condition: template
        value_template: >
          {{ trigger.to_state.state not in ['unknown','unavailable','none']
             and trigger.from_state is not none
             and trigger.from_state.state not in ['unknown','unavailable','none']
             and (trigger.to_state.state | float(0)) > (trigger.from_state.state | float(0)) }}
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.arrosage_sud_eau_totale
        data:
          value: >
            {{ (states('input_number.arrosage_sud_eau_totale') | float(0))
               + ((trigger.to_state.state | float(0)) - (trigger.from_state.state | float(0))) }}

template:
  # Eau totale en m³ pour le DASHBOARD ÉNERGIE (device_class water, cumulatif).
  - sensor:
      - name: "Arrosage SUD eau totale"
        unique_id: arrosage_sud_eau_totale_m3
        icon: mdi:water
        unit_of_measurement: "m³"
        device_class: water
        state_class: total_increasing
        state: >
          {{ (states('input_number.arrosage_sud_eau_totale') | float(0) / 1000) | round(3) }}
