      # ══════════════════════════════════════════════════════════════════════
      # SYSTÈME DE COULEURS HA — Variables couleur v2024+
      # ══════════════════════════════════════════════════════════════════════
      ha-color-fill-neutral-quiet-resting: "rgba(4, 8, 22, 0.92)"      # Noir-bleu
      ha-color-surface-default: "rgba(4, 8, 22, 0.92)"                 # Noir-bleu
      ha-color-fill-neutral-quiet: "rgba(6, 12, 28, 0.85)"             # Bleu-noir
      ha-color-on-neutral-quiet: "var(--primary-text-color)"           # Blanc
      ha-color-on-neutral-normal: "var(--primary-text-color)"          # Blanc
      ha-color-on-primary-normal: "var(--primary-text-color)"          # Blanc
      ha-color-fill-primary-normal-resting: "rgba(1, 2, 8, 0.90)" 
      ha-color-form-background: "rgba(1, 2, 8, 0.90)" 
  
      # ══════════════════════════════════════════════════════════════════════
      # ENERGY DASHBOARD — Tableau de bord énergie
      # ══════════════════════════════════════════════════════════════════════
      energy-grid-consumption-color: "#1F7FFF"                          # Bleu électrique — consommation
      energy-grid-return-color: "#00E8FF"                               # Cyan — injection réseau
      energy-solar-color: "#FFD050"                                     # Or chaud — solaire
      energy-battery-in-color: "#FF9500"                                # Orange — charge
      energy-battery-out-color: "#AAFF00"                               # Vert lime — décharge

      # ══════════════════════════════════════════════════════════════════════
      # HACS INTEGRATION — Home Assistant Community Store
