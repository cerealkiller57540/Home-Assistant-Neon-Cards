      hacs-error-color: "var(--error-color)"                            # Rose-rouge
      hacs-warning-color: "var(--warning-color)"                        # Orange
      hacs-update-color: "var(--gas-helium)"                             # Or solaire — mise à jour disponible
      hacs-new-color: "var(--gas-krypton)"                              # Vert spectral — nouveau composant
      hacs-default-icon-color: "var(--gas-argon)"                       # Violet ionisé — icône neutre HACS

      # ══════════════════════════════════════════════════════════════════════
      # KIOSK MODE — Support écran mural iPad
