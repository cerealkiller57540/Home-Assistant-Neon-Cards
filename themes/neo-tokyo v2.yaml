      kiosk-touch-scale: "0.97"                                         # Échelle toucher
      kiosk-card-spacing: "16px"                                        # Espacement
      kiosk-min-touch-target: "44px"                                    # Taille min bouton

      # ══════════════════════════════════════════════════════════════════════
      # TIMING DES ANIMATIONS — Vitesses de transition
      # ══════════════════════════════════════════════════════════════════════
      animation-speed-card: "4s"                                        # Cartes
      animation-speed-sidebar: "3s"                                     # Sidebar
      animation-speed-header: "5s"                                      # Header
      animation-speed-badge: "2.5s"                                     # Badges
      animation-speed-rain: "2s"                                        # Pluie

  card-mod-theme: neo-tokyo-v2

  # ============================================================
  # CARD-MOD CARD — shadow DOM de chaque ha-card
  # Sélecteurs : :host = la card elle-même
  # ============================================================
  card-mod-card: |
    :host {
      position: relative;
      border-radius: 14px;
      --current-gas: var(--gas-xenon);
    }

    :host::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      pointer-events: none;
      z-index: 2;

      /* Look de base */
      box-shadow:
        inset 0 2px 0 0 var(--current-gas),
        0 0 12px var(--current-gas),
        0 0 20px rgba(var(--rgb-gas-xenon), 0.3);

      mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
      -webkit-mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);

      opacity: 1;
    }

    :host(:hover) {
    /* L'opacité sur le host directement pour éviter les conflits de couches */
    opacity: 0.92;
    #transform: translateY(-3px) scale(1.012);
    }

    :host(:hover)::before {
      /* On enchaîne 3 phases :
         1. L'hésitation (flicker initial)
         2. Le flash de réussite
         3. La stabilité finale (forwards) */
      animation:
        neon-struggle 0.4s steps(1) 2,       /* Galère : 2 cycles de 0.4s */
        neon-ignite 0.6s steps(1) 0.8s forwards; /* Allumage final après 0.8s */
        filter: brightness(1.2);
        transition: opacity 0.5s ease-in-out, --current-gas 1s ease;
    }

    /* Phase 1 : Le tube qui siffle et refuse de partir */
    @keyframes neon-struggle {
      0%   { opacity: 1; --current-gas: var(--gas-hydrogen); }
      20%  { opacity: 0; }
      40%  { opacity: 0.6; --current-gas: var(--gas-neon); }
      60%  { opacity: 0; }
      80%  { opacity: 0.8; --current-gas: var(--gas-mercury); }
      100% { opacity: 0; }
    }

    /* Phase 2 : L'allumage chromatique et stabilisation */
    @keyframes neon-ignite {
      0%   { opacity: 1; --current-gas: var(--gas-krypton); }
      20%  { --current-gas: var(--gas-helium); }
      40%  { --current-gas: var(--gas-radon); }
      /* Stabilisation sur le Xénon ou l'Argon */
      100% { opacity: 1; --current-gas: var(--gas-xenon); }
    }

    @media (max-width: 767px) {
      :host::before { animation: none !important; opacity: 0.5; }
      :host(:hover)::before { animation: none !important; }
    }

    :host::after {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border-radius: 14px;
        pointer-events: none;
        z-index: 3;

        /* Le "glow" interne et externe du coin uniquement */
        box-shadow:
          inset 2px 2px 0 0 var(--current-gas),
          0 0 8px var(--current-gas);

        mask-image: linear-gradient(180deg, transparent, black 15%, black 85%, transparent);
        -webkit-mask-image: linear-gradient(180deg, transparent, black 15%, black 85%, transparent);

        opacity: 1;
        transition: --current-gas 0.5s ease;
      }

      /* La bordure krypton sans background override */
      :host(:has(ha-card.active)) ha-card {
        border-color: rgba(var(--rgb-gas-krypton), 0.5);
        box-shadow: 0 0 15px rgba(var(--rgb-gas-krypton), 0.2);
      }

  # ============================================================
  # CARD-MOD ROOT — document principal (light DOM)
  # ha-card y est directement accessible
  # ============================================================
  card-mod-root: |

    * {
      font-family: 'Orbitron', var(--primary-font-family), system-ui, sans-serif;
    }

    ha-card {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    ha-icon, ha-svg-icon, ha-icon-button {
      color: var(--accent-color);
      filter: drop-shadow(0 0 6px currentColor);
    }

    .name {
      text-shadow: 0 0 3px rgba(255,255,255,0.3), 0 0 8px rgba(var(--rgb-accent-color), 0.2);
    }
    .state, .value {
      text-shadow: 0 0 3px rgba(255,255,255,0.5), 0 0 8px rgba(var(--rgb-accent-color), 0.4);
    }

    @keyframes edges-pulse {
      0%,  100% { box-shadow: 0 0 4px #fff, 0 0 10px var(--gas-xenon), 0 0 22px var(--gas-xenon), 0 0 40px rgba(var(--rgb-gas-xenon), 0.7), 0 0 70px rgba(var(--rgb-gas-argon), 0.35); }
      8%         { box-shadow: 0 0 2px #fff, 0 0 4px var(--gas-xenon), 0 0 8px var(--gas-xenon), 0 0 14px rgba(var(--rgb-gas-xenon), 0.3); }
      9%         { box-shadow: 0 0 8px #fff, 0 0 16px var(--gas-krypton), 0 0 35px var(--gas-krypton), 0 0 60px rgba(var(--rgb-gas-krypton), 0.9), 0 0 100px rgba(var(--rgb-gas-krypton), 0.4); }
      10%        { box-shadow: 0 0 4px #fff, 0 0 10px var(--gas-xenon), 0 0 22px var(--gas-xenon), 0 0 40px rgba(var(--rgb-gas-xenon), 0.7), 0 0 70px rgba(var(--rgb-gas-argon), 0.35); }
      42%        { box-shadow: 0 0 3px #fff, 0 0 7px var(--gas-xenon), 0 0 16px var(--gas-xenon), 0 0 28px rgba(var(--rgb-gas-xenon), 0.5); }
      43%        { box-shadow: 0 0 6px #fff, 0 0 14px var(--gas-helium), 0 0 30px var(--gas-helium), 0 0 55px rgba(var(--rgb-gas-helium), 0.8), 0 0 85px rgba(var(--rgb-gas-radon), 0.4); }
      44%        { box-shadow: 0 0 4px #fff, 0 0 10px var(--gas-xenon), 0 0 22px var(--gas-xenon), 0 0 40px rgba(var(--rgb-gas-xenon), 0.7), 0 0 70px rgba(var(--rgb-gas-argon), 0.35); }
    }

    app-header,
      ha-app-layout app-header,
      app-toolbar,
      .header,
      mwc-tab-bar {
          border-bottom: 3px solid #fff ;
          box-shadow:
            0 0 4px #fff,
            0 0 10px var(--gas-xenon),
            0 0 22px var(--gas-xenon),
            0 0 40px rgba(var(--rgb-gas-xenon), 0.7),
            0 0 70px rgba(var(--rgb-gas-argon), 0.35) ;
          animation: edges-pulse 4s ease-in-out infinite;
      }

    ha-icon:hover {
    transform: scale(1.25) translateX(5px) rotate(-5deg);
    opacity: 1.0;
    transition: all 0.3s ease;
    }

    /* ── Vignette sombre en haut de page ── */
    hui-root::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 140px;
      background: linear-gradient(180deg, rgba(2,1,12,0.72) 0%, rgba(4,2,18,0.38) 55%, transparent 100%);
      pointer-events: none;
      z-index: 9999;
    }

    /* ── iPad — animations OFF (performance) ── */
    @media (hover: none) and (pointer: coarse) and (min-width: 768px) {
      ha-card, ha-card:hover {
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
      ha-card:hover { opacity: 0.92; }
      ha-icon, ha-svg-icon, ha-icon-button {
        filter: drop-shadow(0 0 4px currentColor);
        animation: none !important;
        transition: none !important;
      }
      app-header, ha-app-layout app-header, app-toolbar, .header, mwc-tab-bar {
        animation: none !important;
        transition: none !important;
        box-shadow: 0 0 8px var(--gas-xenon) !important;
      }
    }

    /* ── Smartphone — toutes animations OFF ── */
    @media (max-width: 767px) {
      ha-card, ha-card:hover {
        transform: none !important;
        animation: none !important;
        transition: none !important;
      }
      ha-card:hover { opacity: 0.92; }
      app-header, ha-app-layout app-header, app-toolbar, .header, mwc-tab-bar {
        animation: none !important;
        box-shadow: 0 0 8px var(--gas-xenon) !important;
      }
    }

  # ============================================================
  # CARD-MOD SIDEBAR — shadow DOM de la sidebar
  # ============================================================
  card-mod-sidebar: |
    @keyframes edge-pulse {
      0%   { opacity: 0.7; }
      50%  { opacity: 1.0; }
      100% { opacity: 0.7; }
    }
    @keyframes title-glitch-rgb {
      0%,  9%   { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), 1px 0 rgba(var(--rgb-accent-color),0.5); letter-spacing: 2px; }
      10%        { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), -5px 0 rgba(var(--rgb-primary-color),1.0), 5px 0 rgba(var(--rgb-accent-color),1.0); letter-spacing: 3px; transform: skewX(-2deg); }
      11%        { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), 1px 0 rgba(var(--rgb-accent-color),0.5); letter-spacing: 2px; transform: skewX(0); }
      12%,  39%  { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), 1px 0 rgba(var(--rgb-accent-color),0.5); letter-spacing: 2px; }
      40%        { text-shadow: 0 0 8px #fff, 0 0 18px var(--primary-color), 0 0 48px var(--primary-color), 8px 0 rgba(var(--rgb-primary-color),1.0), -8px 0 rgba(var(--rgb-accent-color),1.0); letter-spacing: 5px; transform: skewX(3deg); }
      41%        { text-shadow: 0 0 2px #fff, 0 0 6px var(--primary-color), 0 0 14px var(--primary-color), -2px 0 rgba(var(--rgb-accent-color),0.7); letter-spacing: 1px; transform: skewX(-1deg); }
      42%,  71%  { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), 1px 0 rgba(var(--rgb-accent-color),0.5); letter-spacing: 2px; transform: skewX(0); }
      72%        { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), -4px 0 rgba(var(--rgb-primary-color),0.9), 4px 0 rgba(var(--rgb-accent-color),0.9); letter-spacing: 2px; }
      73%,  100% { text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color), 1px 0 rgba(var(--rgb-accent-color),0.5); letter-spacing: 2px; }
    }
    @keyframes title-flicker {
      0%,  14%  { opacity: 1;    filter: brightness(1.1) saturate(1.4); }
      15%        { opacity: 0.4;  filter: brightness(0.5) saturate(0.8); }
      16%        { opacity: 1;    filter: brightness(1.5) saturate(1.6); }
      17%,  44%  { opacity: 1;    filter: brightness(1.1) saturate(1.4); }
      45%        { opacity: 0.7;  filter: brightness(0.7) saturate(0.9); }
      46%        { opacity: 1;    filter: brightness(1.4) saturate(1.5); }
      47%        { opacity: 0.85; filter: brightness(0.9) saturate(1.2); }
      48%,  79%  { opacity: 1;    filter: brightness(1.1) saturate(1.4); }
      80%        { opacity: 0.15; filter: brightness(0.2) saturate(0.5); }
      81%        { opacity: 1;    filter: brightness(1.7) saturate(1.8); }
      82%,  100% { opacity: 1;    filter: brightness(1.1) saturate(1.4); }
    }
    @keyframes neon-flicker {
      0%,  17%  { box-shadow: 0 0 6px rgba(var(--rgb-gas-argon),0.6), 0 0 12px rgba(var(--rgb-primary-color),0.3), inset 0 0 10px rgba(var(--rgb-gas-argon),0.12); }
      18%        { box-shadow: 0 0 2px rgba(var(--rgb-gas-argon),0.1), inset 0 0 2px rgba(var(--rgb-gas-argon),0.03); }
      19%        { box-shadow: 0 0 6px rgba(var(--rgb-gas-argon),0.6), 0 0 12px rgba(var(--rgb-primary-color),0.3), inset 0 0 10px rgba(var(--rgb-gas-argon),0.12); }
      20%        { box-shadow: 0 0 2px rgba(var(--rgb-gas-argon),0.1), inset 0 0 2px rgba(var(--rgb-gas-argon),0.03); }
      21%,  74%  { box-shadow: 0 0 6px rgba(var(--rgb-gas-argon),0.6), 0 0 12px rgba(var(--rgb-primary-color),0.3), inset 0 0 10px rgba(var(--rgb-gas-argon),0.12); }
      75%         { box-shadow: 0 0 18px rgba(var(--rgb-gas-radon),0.8), 0 0 30px rgba(var(--rgb-primary-color),0.5), inset 0 0 16px rgba(var(--rgb-gas-argon),0.2); }
      76%         { box-shadow: 0 0 2px rgba(var(--rgb-gas-argon),0.1), inset 0 0 2px rgba(var(--rgb-gas-argon),0.03); }
      77%,  100% { box-shadow: 0 0 6px rgba(var(--rgb-gas-argon),0.6), 0 0 12px rgba(var(--rgb-primary-color),0.3), inset 0 0 10px rgba(var(--rgb-gas-argon),0.12); }
    }

    :host {
      position: relative;
      overflow: hidden;
      primary-font-family: "'Orbitron', system-ui, sans-serif"
      background:
        linear-gradient(145deg,
          rgba(255,255,255,0.055) 0%,
          rgba(255,255,255,0.018) 35%,
          rgba(255,255,255,0.000) 60%
        ),
        linear-gradient(0deg,
          rgba(var(--rgb-primary-color), 0.07)  0%,
          rgba(var(--rgb-primary-color), 0.04) 20%,
          transparent 50%
        ),
        rgba(4, 6, 20, 0.82);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
    }

    @keyframes edge-flicker {
      0%,  100% { opacity: 1.0;  box-shadow: 0 0 6px var(--gas-argon), 0 0 14px rgba(var(--rgb-gas-argon), 0.7), 0 0 30px rgba(var(--rgb-gas-radon), 0.25); width: 3px; }
      12%        { opacity: 0.2;  box-shadow: none; }
      13%        { opacity: 1.0;  box-shadow: 0 0 10px var(--gas-argon), 0 0 22px rgba(var(--rgb-gas-argon), 1.0), 0 0 40px rgba(var(--rgb-gas-xenon), 0.4); width: 4px; }
      14%        { opacity: 0.7;  box-shadow: 0 0 6px var(--gas-argon), 0 0 14px rgba(var(--rgb-gas-argon), 0.7); width: 3px; }
      45%        { opacity: 0.85; box-shadow: 0 0 4px var(--gas-argon), 0 0 10px rgba(var(--rgb-gas-argon), 0.5); }
      46%        { opacity: 1.0;  box-shadow: 0 0 14px var(--gas-krypton), 0 0 28px rgba(var(--rgb-gas-krypton), 1.0), 0 0 50px rgba(var(--rgb-gas-helium), 0.4); width: 5px; }
      47%        { opacity: 0.4;  box-shadow: none; width: 3px; }
      48%        { opacity: 1.0;  box-shadow: 0 0 6px var(--gas-argon), 0 0 14px rgba(var(--rgb-gas-argon), 0.7), 0 0 30px rgba(var(--rgb-gas-radon), 0.25); }
      80%        { opacity: 0.75; box-shadow: 0 0 4px var(--gas-argon), 0 0 10px rgba(var(--rgb-gas-argon), 0.5); }
      81%        { opacity: 1.0;  box-shadow: 0 0 8px var(--gas-argon), 0 0 18px rgba(var(--rgb-gas-argon), 0.8), 0 0 35px rgba(var(--rgb-gas-xenon), 0.3); width: 4px; }
      82%        { opacity: 1.0;  box-shadow: 0 0 6px var(--gas-argon), 0 0 14px rgba(var(--rgb-gas-argon), 0.7), 0 0 30px rgba(var(--rgb-gas-radon), 0.25); width: 3px; }
    }

    :host::after {
      content: "";
      position: absolute;
      top: 0; right: 0;
      width: 3px; height: 100%;
      background: linear-gradient(180deg,
        transparent                        0%,
        rgba(var(--rgb-gas-argon), 0.5)   15%,
        var(--gas-argon)                   35%,
        var(--primary-color)               50%,
        var(--gas-argon)                   65%,
        rgba(var(--rgb-gas-argon), 0.5)   85%,
        transparent                        100%);
      box-shadow:
        0 0 6px var(--gas-argon),
        0 0 14px rgba(var(--rgb-gas-argon), 0.7),
        0 0 30px rgba(var(--rgb-gas-radon), 0.25);
      animation: edge-flicker 6s step-end infinite;
      z-index: 10;
    }

    .menu .title {
      font-weight: 600;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color);
      animation: title-glitch-rgb 11s step-end infinite, title-flicker 7s step-end infinite;
    }

    @keyframes menu-flicker {
      0%,  100% { box-shadow: 0 0 8px #fff, 0 0 14px var(--gas-argon), 0 0 28px var(--gas-argon), 0 0 45px rgba(var(--rgb-gas-argon), 0.7), 0 0 70px rgba(var(--rgb-gas-radon), 0.2); }
      7%         { box-shadow: 0 0 3px #fff, 0 0 6px var(--gas-argon), 0 0 12px var(--gas-argon); }
      8%         { box-shadow: 0 0 12px #fff, 0 0 22px var(--gas-helium), 0 0 42px var(--gas-helium), 0 0 70px rgba(var(--rgb-gas-helium), 0.9), 0 0 110px rgba(var(--rgb-gas-krypton), 0.3); }
      9%         { box-shadow: 0 0 8px #fff, 0 0 14px var(--gas-argon), 0 0 28px var(--gas-argon), 0 0 45px rgba(var(--rgb-gas-argon), 0.7), 0 0 70px rgba(var(--rgb-gas-radon), 0.2); }
      55%        { box-shadow: 0 0 4px #fff, 0 0 8px var(--gas-argon), 0 0 18px var(--gas-argon); }
      56%        { box-shadow: 0 0 10px #fff, 0 0 20px var(--gas-krypton), 0 0 38px var(--gas-krypton), 0 0 62px rgba(var(--rgb-gas-krypton), 0.8), 0 0 90px rgba(var(--rgb-gas-neon), 0.25); }
      57%        { box-shadow: 0 0 8px #fff, 0 0 14px var(--gas-argon), 0 0 28px var(--gas-argon), 0 0 45px rgba(var(--rgb-gas-argon), 0.7), 0 0 70px rgba(var(--rgb-gas-radon), 0.2); }
    }
    .menu {
      border-bottom: 3px solid #fff;
      box-shadow:
        0 0 8px #fff,
        0 0 14px var(--gas-argon),
        0 0 28px var(--gas-argon),
        0 0 45px rgba(var(--rgb-gas-argon), 0.7),
        0 0 70px rgba(var(--rgb-gas-radon), 0.2);
      animation: menu-flicker 5s step-end infinite;
    }

    ha-md-list-item {
      transition: transform 0.2s ease, background 0.2s ease;
      border-radius: 8px;
    }
    ha-md-list-item:hover {
      transform: translateX(4px);
      background: rgba(var(--rgb-accent-color), 0.06) ;
      box-shadow:
        -3px 0 8px var(--blacklight-color),
        -6px 0 15px rgba(var(--rgb-blacklight-color), 0.7),
        inset 0 0 12px rgba(var(--rgb-accent-color), 0.08) !important;
    }

    ha-md-list-item:hover ha-icon,
    ha-md-list-item:hover iron-icon,
    ha-md-list-item:hover ha-svg-icon,
    ha-md-list-item:hover ha-svg-icon[slot="start"],
    ha-md-list-item:hover ha-icon[slot="start"] {
    transform: scale(1.25) translateX(5px) rotate(-5deg);
    transition: all 0.3s ease;
    }
    @keyframes border-pulse {
      0%, 100% { border-left-width: 2px; }
      50%       { border-left-width: 5px; }
    }
    ha-md-list-item.selected {
      background: rgba(var(--rgb-primary-color), 0.07) ;
      border-left: 2px solid var(--secondary-color);
      border-radius: 8px;
      animation: neon-flicker 7s step-end infinite, border-pulse 2.5s ease-in-out infinite;
    }
    ha-md-list-item.selected .item-text {
      color: #fff;
      text-shadow: 0 0 5px #fff, 0 0 12px var(--primary-color), 0 0 28px var(--primary-color);
    }
    ha-md-list-item ha-icon,
    ha-md-list-item ha-svg-icon {
      filter: drop-shadow(0 0 4px currentColor);
      transition: all 0.3s ease;
    }
    ha-md-list-item:hover ha-icon,
    ha-md-list-item:hover ha-svg-icon {
      filter: drop-shadow(0 0 8px currentColor) saturate(1.5) brightness(1.2);
      transform: scale(1.1);
    }

    /* ── Smartphone — animations OFF ── */
    @media (max-width: 767px) {
      :host, :host::after, :host::before { animation: none !important; }
      .menu { animation: none !important; box-shadow: 0 0 8px var(--gas-argon) !important; }
      .menu .title { animation: none !important; }
      ha-md-list-item.selected { animation: none !important; }
      ha-md-list-item:hover { transform: none !important; }
    }

    /* ── iPad — animations OFF (performance) ── */
    @media (hover: none) and (pointer: coarse) and (min-width: 768px) {
      :host,
      :host::before,
      :host::after,
      .menu,
      .menu .title,
      ha-md-list-item,
      ha-md-list-item.selected,
      ha-md-list-item.selected .item-text {
        animation: none !important;
        transition: none !important;
      }
      .menu .title {
        text-shadow: 0 0 5px #fff, 0 0 14px var(--primary-color);
      }
      ha-md-list-item.selected {
        border-left: 2px solid var(--secondary-color);
      }
      ha-md-list-item.selected .item-text {
        text-shadow: 0 0 8px var(--primary-color);
      }
    }
