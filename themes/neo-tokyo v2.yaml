      mdc-select-disabled-dropdown-icon-color: "var(--disabled-text-color)" # Bleu ardoise
      mdc-select-disabled-fill-color: "rgba(var(--rgb-disabled-color), 0.20)" # Bleu ardoise
      mdc-select-disabled-ink-color: "var(--disabled-text-color)"      # Bleu ardoise
      mdc-text-field-fill-color: "var(--card-background-color)"        # Noir-bleu
      mdc-text-field-ink-color: "var(--primary-text-color)"            # Blanc
      mdc-text-field-label-ink-color: "var(--accent-color)"            # Cyan
      mdc-text-field-disabled-fill-color: "rgba(var(--rgb-disabled-color), 0.20)"
      mdc-text-field-disabled-ink-color: "var(--disabled-text-color)"  # Bleu ardoise
      mdc-theme-on-primary: "#020510"                                  # Noir-bleu
      mdc-theme-on-secondary: "#020510"                                # Noir-bleu
      mdc-theme-on-surface: "var(--primary-text-color)"                # Blanc
      mdc-theme-text-primary-on-background: "var(--primary-text-color)" # Blanc
      mdc-theme-primary: "var(--gas-xenon)"                            # Bleu électrique
      mdc-theme-secondary: "var(--gas-xenon)"                          # Bleu électrique
      mdc-theme-surface: "var(--card-background-color)"                # Noir-bleu
