# Neo Tokyo Theme for Home Assistant — v2
# Cyberpunk / Blade Runner — atmosphère bleu-indigo nocturne,
# néon rose/magenta en ponctuation, bleu électrique comme glow structurel
# Installation : /config/themes/neo-tokyo-v2.yaml
# Activate     : Settings → Appearance → Themes → Neo Tokyo v2

neo-tokyo-v2:
  modes:
    dark:
      # ══════════════════════════════════════════════════════════════════════
      # COULEURS DE BASE — Palette principale du thème
      # ══════════════════════════════════════════════════════════════════════
      primary-color: "#B400FF"                           # Violet néon — accent principal
      accent-color: "#00fff9"                            # Cyan électrique — accent secondaire
      secondary-color: "#6400B4"                         # Violet profond — badges, liens discrets
      blacklight-color: "#5D0CED"                        # Violet UV — glow ultraviolet
      lovelace-background: "center / cover no-repeat fixed url('/local/neo-tokyo-v4.png')"
      shadow-color: "rgba(var(--rgb-accent-color), 0.30)"
      bar-box-shadow: ""

      # ══════════════════════════════════════════════════════════════════════
      # ÉTAT DES ÉLÉMENTS (ON/OFF/HOME/etc)
      # ══════════════════════════════════════════════════════════════════════
      state-active-color: "#9600C8"                      # Violet doux — état allumé/actif
      state-inactive-color: "rgba(100, 130, 200, 0.18)"  # Bleu translucide — état inactif
      state-on-color: "var(--state-active-color)"        # Alias état ON
      state-off-color: "var(--state-inactive-color)"     # Alias état OFF
      state-home-color: "#00b870"                        # Vert présence — occupant à la maison
      state-not-home-color: "#3a4862"                    # Bleu-gris — absent/dehors
      state-unavailable-color: "#1a2238"                 # Bleu-gris nuit — entité indisponible

      # ══════════════════════════════════════════════════════════════════════
      # STATUTS — Succès, avertissements, erreurs
      # ══════════════════════════════════════════════════════════════════════
      success-color: "#00FFAA"                           # Vert néon — OK/succès ✓
      warning-color: "#FFB800"                           # Orange ambré — avertissement ⚠
      error-color: "#FF2D6B"                             # Rose-rouge — erreur critique ✗
      error-state-color: "var(--error-color)"            # Alias erreur
      warning-state-color: "var(--warning-color)"        # Alias avertissement
      success-state-color: "var(--success-color)"        # Alias succès
      info-color: "var(--accent-color)"                  # Cyan — information
      info-state-color: "var(--accent-color)"            # Alias info

      # ══════════════════════════════════════════════════════════════════════
      # VARIABLES RGB CORRESPONDANTES — Pour usage en rgba()
      # ══════════════════════════════════════════════════════════════════════
      rgb-primary-color: "180, 0, 255"                   # Violet néon RGB
      rgb-secondary-color: "100, 0, 180"                 # Violet profond RGB
      rgb-accent-color: "0, 255, 249"                    # Cyan électrique RGB
      rgb-blacklight-color: "93, 12, 237"                # Violet UV RGB
      rgb-state-active-color: "150, 0, 200"              # Violet doux RGB
      rgb-text-primary-color: "210, 218, 240"            # Blanc-lavande RGB
      rgb-disabled-color: "36, 48, 78"                   # Bleu ardoise RGB
      rgb-card-background-color: "4, 8, 22"              # Noir bleuté RGB
      rgb-success-color: "0, 255, 170"                   # Vert néon RGB
      rgb-warning-color: "255, 184, 0"                   # Orange ambré RGB
      rgb-error-color: "255, 45, 107"                    # Rose-rouge RGB

      # ══════════════════════════════════════════════════════════════════════
      # TEXTE — Couleurs de typographie
      # ══════════════════════════════════════════════════════════════════════
      primary-text-color: "#ffffff"                      # Blanc pur — texte principal
      secondary-text-color: "#b8b8ff"                    # Lavande douce — texte secondaire
      disabled-text-color: "#28304e"                     # Bleu ardoise sombre — texte désactivé
      text-primary-color: "var(--primary-text-color)"    # Alias texte principal
      text-disabled-color: "var(--disabled-text-color)"  # Alias texte désactivé
      disabled-color: "rgba(var(--rgb-gas-krypton), 0.40)" # Vert-turquoise discret

      # ══════════════════════════════════════════════════════════════════════
      # TYPOGRAPHIE — Polices et tailles
      # ══════════════════════════════════════════════════════════════════════
      primary-font-family: "'Orbitron','rajdhani', system-ui, sans-serif"

      # Legacy Paper (ancien système Home Assistant)
      paper-font-common-base_-_font-family: "var(--primary-font-family)"
      paper-font-body1_-_font-family: "var(--primary-font-family)"
      paper-font-headline_-_font-family: "var(--primary-font-family)"
      paper-font-title_-_font-family: "var(--primary-font-family)"

      # Home Assistant Cards
      ha-card-header-font-family: "var(--primary-font-family)"
      ha-font-family-body: "'rajdhani', system-ui, sans-serif"
      ha-font-family-heading: "system-ui, sans-serif"
      ha-font-family-longform: "system-ui, sans-serif"
      ha-font-family-code: "system-ui, sans-serif"

      # Tailles de police (responsive)
      ha-font-size-xs: "calc(12px * var(--ha-font-size-scale))"
      ha-font-size-s: "calc(13px * var(--ha-font-size-scale))"
      ha-font-size-m: "calc(15px * var(--ha-font-size-scale))"
      ha-font-size-l: "calc(17px * var(--ha-font-size-scale))"

      # Material Design List (Sidebar)
      md-list-item-label-text-font: "var(--primary-font-family)"
      md-list-item-trailing-supporting-text-font: "system-ui, sans-serif"
      md-list-item-supporting-text-font: "system-ui, sans-serif"

      # Material Design Components (MDC)
      mdc-typography-font-family: "var(--primary-font-family)"
      mdc-typography-body1-font-family: "'rajdhani', system-ui, sans-serif"
      mdc-typography-body2-font-family: "'rajdhani', system-ui, sans-serif"
      mdc-typography-body2-font-size: "0.95rem"
      mdc-typography-subtitle1-font-family: "'rajdhani', system-ui, sans-serif"
      mdc-typography-subtitle1-font-size: "1.25rem"
      mdc-typography-subtitle2-font-family: "'rajdhani', system-ui, sans-serif"
      mdc-typography-subtitle2-font-size: "1.25rem"
      mdc-typography-headline6-font-family: "var(--primary-font-family)"
      mdc-typography-overline-font-family: "var(--primary-font-family)"
      mdc-typography-button-font-family: "var(--primary-font-family)"
      mdc-data-table-content-font-size: "0.95rem"

      # ══════════════════════════════════════════════════════════════════════
      # ARRIÈRE-PLANS — Gradients et fonds
      # ══════════════════════════════════════════════════════════════════════
      primary-background-color: "#020510"                # Quasi-noir bleuté — fond principal
      secondary-background-color: "#060c1e"              # Bleu nuit dense — fond secondaire
      card-background-color: "rgba(4, 8, 22, 0.82)"      # Semi-transparent — cartes
      paper-card-background-color: "var(--card-background-color)"   # Legacy Paper
      paper-listbox-background-color: "var(--card-background-color)" # Legacy Paper
      paper-dialog-background-color: "rgba(3, 6, 18, 0.94)"         # Dialogue (plus opaque)
      code-editor-background-color: "#010408"            # Noir absolu — éditeur code
      divider-color: "rgba(180, 0, 255, 0.25)"           # Violet translucide — séparateurs

      # ══════════════════════════════════════════════════════════════════════
      # STYLE DES CARTES — Bordures, shadows, glassmorphism
      # ══════════════════════════════════════════════════════════════════════
      ha-card-border-radius: "14px"                       # Coins arrondis
      ha-card-border-width: "1px"                         # Épaisseur bordure
      ha-card-border-color: "rgba(var(--rgb-accent-color), 0.20)" # Cyan translucide
      ha-card-box-shadow: "0 4px 28px rgba(0,0,0,0.70), 0 0 18px rgba(var(--rgb-primary-color), 0.12), inset 0 1px 0 rgba(255,255,255,0.06)"
      ha-card-background: "linear-gradient(145deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 35%, rgba(255,255,255,0.00) 60%), rgba(4, 6, 20, 0.85)"
      ha-card-backdrop-filter: "blur(10px) saturate(140%)" # Effet verre givré

      # ══════════════════════════════════════════════════════════════════════
      # GAZ RARES & RADIATIONS — Palette nucléaire/néon pour glows
      # ══════════════════════════════════════════════════════════════════════

      # ─── Gaz communs (spectres d'émission)
      gas-hydrogen: "#FF00FF"                            # Fuchsia saturé
      gas-mercury: "#00FFFF"                             # Cyan froid labo
      gas-nitrogen: "#BB86FC"                            # Violet pastel doux
      gas-oxygen: "#A9D1FF"                              # Bleu ciel hiver
      gas-sodium: "#FFCC00"                              # Jaune-orange chaud

      # ─── Gaz nobles (utilisés pour les accents principaux)
      gas-xenon: "#00D4FF"                               # Bleu électrique — headers ★
      gas-argon: "#9D4EDD"                               # Violet ionisé — sidebars ★
      gas-radon: "#E0115F"                               # Rose radioactif — accents
      gas-neon: "#FF3D00"                                # Rouge plasma — alertes
      gas-krypton: "#2EE5B6"                             # Vert spectral — états OK ★
      gas-helium: "#FFEE58"                              # Or solaire — météo/curseurs
      rgb-gas-xenon: "0, 212, 255"                       # Xénon RGB
      rgb-gas-argon: "157, 78, 221"                      # Argon RGB
      rgb-gas-radon: "224, 17, 95"                       # Radon RGB
      rgb-gas-krypton: "46, 229, 182"                    # Krypton RGB
      rgb-gas-helium: "255, 238, 88"                     # Hélium RGB
      rgb-gas-neon: "255, 61, 0"                         # Néon RGB

      # ─── Effets de rayonnement (fluorescence active)
      radio-cherenkov: "#00E5FF"                         # Bleu réacteur hyper-vibrant
      radio-uranium: "#CCFF00"                           # Vert vaseline fluo vintage
      radio-plutonium: "#39FF14"                         # Vert toxique saturation max
      radio-actinium: "#E0FFFF"                          # Lueur spectrale blanc-bleuté
      radium-paint: "#C3FDB8"                            # Vert radium (peinture radioactive)
      neutron-blue: "#A5F2F3"                            # Bleu neutronique réacteur
      rgb-radio-cherenkov: "0, 229, 255"                 # Cherenkov RGB
      rgb-radio-uranium: "204, 255, 0"                   # Uranium RGB
      rgb-radio-plutonium: "57, 255, 20"                 # Plutonium RGB
      rgb-radio-actinium: "224, 255, 255"                # Actinium RGB

      # ─── Métaux réactifs (instabilité thermique)
      metal-cesium: "#FFD700"                            # Or liquide instable
      cesium-137-glow: "#1E90FF"                         # Bleu intense désintégration
      metal-americium: "#FF4500"                         # Orange "Safety" chaleur alpha
      metal-thallium: "#A0D6B4"                          # Vert gris poison spectral
      rgb-metal-cesium: "255, 215, 0"                    # Cesium RGB
      rgb-metal-americium: "255, 69, 0"                  # Americium RGB
      rgb-metal-thallium: "160, 214, 180"                # Thallium RGB

      # ─── États stellaires & fusion nucléaire (haute énergie)
      plasma-corona: "#FFD600"                           # Plasma solaire ultra-dense
      plasma-hydrogen: "#FF007F"                         # Rose fusion H ionisé
      plasma-magnetic: "#00E5FF"                         # Confinement Tokamak
      plasma-void: "#9D00FF"                             # Violet vide basse-pression
      plasma-electric: "#B9F2FF"                         # Bleu foudre arc électrique
      plasma-h-alpha: "#FF3366"                          # Rose-rouge stellaire (H)
      plasma-o-iii: "#4AF2A1"                            # Vert fantomatique (O III)
      plasma-sulfur: "#FFAD33"                           # Orange soufre ionisation
      plasma-mercury: "#E573FF"                          # Violet électrique mercure
      rgb-plasma-hydrogen: "255, 0, 127"                 # Hydrogen plasma RGB
      rgb-plasma-magnetic: "0, 229, 255"                 # Magnetic plasma RGB
      rgb-plasma-h-alpha: "255, 51, 102"                 # H-alpha RGB
      rgb-plasma-o-iii: "74, 242, 161"                   # O-III RGB
      rgb-plasma-sulfur: "255, 173, 51"                  # Sulfur RGB
      rgb-plasma-mercury: "229, 115, 255"                # Mercury RGB
      rgb-cesium-glow: "30, 144, 255"                    # Cesium glow RGB
      rgb-critical-blue: "165, 242, 243"                 # Critical blue RGB

      # ─── Fission & contrôle nucléaire
      gas-iodine-131: "#9D81FF"                          # Violet spectral iode
      safety-boron: "#7CFF00"                            # Vert flamme absorption neutrons
      rgb-gas-iodine: "157, 129, 255"                    # Iodine RGB
      rgb-safety-boron: "124, 255, 0"                    # Boron RGB

      # ─── Couleurs profondes (fonds sombres)
      radio-cobalt-60: "#001B44"                         # Bleu nuit irradié stockage gamma
      plasma-ultraviolet: "#310062"                      # Indigo ionisé limite UV
      plasma-uv-glow: "#6200EA"                          # Violet UV fluorescence active
      dark-actinoid: "#120021"                           # Noir radioactif ombre-violet
      metal-osmium: "#192231"                            # Bleu-gris métal lourd
      gas-xenon-deep: "#004E64"                          # Bleu pétrole Xe haute-pression
      rgb-radio-cobalt: "0, 27, 68"                      # Cobalt RGB
      rgb-plasma-uv: "49, 0, 98"                         # UV plasma RGB
      rgb-plasma-uv-glow: "98, 0, 234"                   # UV glow RGB

      # ══════════════════════════════════════════════════════════════════════
      # TUNING & ANIMATIONS — Opacités, blur, transitons
      # ══════════════════════════════════════════════════════════════════════
      glow-opacity-idle: "0.10"                          # Glow léger (repos)
      glow-opacity-hover: "0.25"                         # Glow moyen (survol)
      glow-opacity-active: "0.45"                        # Glow intense (actif)
      border-opacity-idle: "0.18"                        # Bordure discrète
      border-opacity-hover: "0.38"                       # Bordure visible survol
      blur-strength: "14px"                              # Flou normal glassmorphism
      blur-strength-heavy: "20px"                        # Flou intensifié

      # ══════════════════════════════════════════════════════════════════════
      # SIDEBAR — Navigation latérale
      # ══════════════════════════════════════════════════════════════════════
      sidebar-background-color: "rgba(4, 8, 22, 0.40)"   # Semi-transparent noir-bleu
      sidebar-icon-color: "#b8b8ff"                      # Lavande — icônes
      sidebar-text-color: "#b8b8ff"                      # Lavande — texte items
      sidebar-selected-background-color: "#1a0f2e"       # Violet sombre — élément actif
      sidebar-selected-icon-color: "var(--primary-color)" # Violet néon — icône sélectionnée
      sidebar-selected-text-color: "#ffffff"             # Blanc pur — texte sélectionné

      # ══════════════════════════════════════════════════════════════════════
      # HEADER / TOOLBAR — Barre supérieure
      # ══════════════════════════════════════════════════════════════════════
      app-header-background-color: "rgba(2, 5, 16, 0.90)" # Quasi-noir bleuté
      app-header-text-color: "var(--primary-text-color)"  # Blanc pur
      app-header-edit-background-color: "#050c22"         # Bleu très sombre (édition)
      app-header-edit-text-color: "var(--primary-color)"  # Violet néon (édition)
      app-header-selection-bar-color: "var(--accent-color)" # Cyan underline

      # ══════════════════════════════════════════════════════════════════════
      # ICÔNES — États et couleurs
      # ══════════════════════════════════════════════════════════════════════
      state-icon-color: "var(--accent-color)"            # Cyan — icône par défaut
      state-icon-active-color: "var(--state-active-color)" # Violet — icône active
      state-icon-unavailable-color: "var(--disabled-text-color)" # Bleu ardoise
      icon-color: "var(--accent-color)"                  # Cyan — icônes générales
      active-icon-color: "var(--state-active-color)"     # Violet — icône active
      disabled-icon-color: "var(--disabled-text-color)"  # Bleu ardoise — icône désactivée
      state-switch-off-color: "var(--state-inactive-color)" # Bleu translucide — icône switch OFF
      state-switch-on-color: "var(--gas-sodium)" # icône switch ON
      state-switch-inactive-color: "var(--state-inactive-color)" # Bleu translucide — icône switch inactif
      state-cover-shutter-open-color: "var(--metal-cesium)" # icône volet ouvert
      state-cover-open-color: "var(--state-active-color)" # Violet — icône couverture ouverte
      state-cover-active-color: "var(--state-active-color)" # Violet — icône couverture active
      state-cover-shutter-closed-color: "var(--radio-cobalt-60)" # icône volet fermé
      state-cover-closed-color: "var(--state-inactive-color)" # Bleu translucide — icône couverture fermée
      state-cover-inactive-color: "var(--state-inactive-color)" # Bleu translucide — icône couverture inactive
      state-binary_sensor-door-off-color: "var(--radio-plutonium)" # icône capteur binaire porte fermée
      state-binary_sensor-off-color: "var(--state-inactive-color)" # Bleu translucide — icône capteur binaire désactivé
      state-binary_sensor-inactive-color: "var(--state-inactive-color)" # Bleu translucide — icône capteur binaire inactif  
      state-input_boolean-off-color: "var(--state-inactive-color)" # Bleu translucide — icône input boolean désactivé
      state-input_boolean-inactive-color: "var(--state-inactive-color)" # Bleu translucide — icône input boolean inactif
      state-input_boolean-on-color: "var(--gas-sodium)" # icône input boolean activé
      state-input_boolean-active-color: "var(--state-active-color)" # Violet — icône input boolean active

      # ══════════════════════════════════════════════════════════════════════
      # CLIMATISATION — États thermostat (auto/cool/heat/etc)
      # ══════════════════════════════════════════════════════════════════════
      state-climate-auto-color: "var(--success-color)"       # Vert — mode auto
      state-climate-cool-color: "var(--cesium-137-glow)"     # Cyan — refroidissement
      state-climate-heat-color: "var(--plasma-h-alpha)"      # chauffage
      state-climate-dry-color: "var(--warning-color)"        # Orange — déshumidification
      state-climate-fan_only-color: "var(--secondary-color)" # Violet — ventilateur seul
      state-climate-eco-color: "var(--success-color)"        # Vert — mode éco
      state-climate-idle-color: "var(--disabled-text-color)" # Bleu ardoise — arrêt
      state-climate-manual-color: "var(--primary-color)"     # Violet néon — manuel
      state-climate-off-color: "var(--state-inactive-color)" # Bleu translucide — éteint
      state-climate-active-color: "var(--accent-color)"      # Cyan — refroidissement

      # ══════════════════════════════════════════════════════════════════════
      # INTERRUPTEURS — Toggle switches (ON/OFF)
      # ══════════════════════════════════════════════════════════════════════
      switch-checked-button-color: "var(--switch-checked-track-color)" # Bouton ON
      switch-checked-track-color: "rgba(var(--rgb-gas-argon), 0.50)"   # Rail violet ON
      switch-checked-color: "var(--state-active-color)"                # Violet doux ON
      switch-unchecked-button-color: "#203060"                         # Bleu marine bouton OFF
      switch-unchecked-track-color: "rgba(32, 48, 96, 0.50)"           # Rail bleu OFF
      switch-unchecked-color: "rgba(32, 48, 96, 0.50)"                 # Bleu OFF

      # ══════════════════════════════════════════════════════════════════════
      # CURSEURS — Slider/range inputs
      # ══════════════════════════════════════════════════════════════════════
      paper-slider-knob-color: "var(--accent-color)"                 # Cyan — curseur
      paper-slider-knob-start-color: "var(--accent-color)"           # Cyan — position initiale
      paper-slider-pin-color: "var(--accent-color)"                  # Cyan — pin label
      paper-slider-active-color: "var(--accent-color)"               # Cyan — rail actif
      paper-slider-container-color: "rgba(var(--rgb-accent-color), 0.30)" # Cyan translucide — rail
      paper-slider-secondary-color: "var(--primary-color)"           # Violet néon — curseur secondaire
      ha-slider-indicator-color: "rgba(var(--rgb-gas-xenon), 0.85)"  # Bleu électrique — label
      ha-slider-thumb-color: "rgba(var(--rgb-gas-xenon), 1)"         # Bleu électrique — curseur

      # ══════════════════════════════════════════════════════════════════════
      # DIALOGUES — Pop-ups et modales
      # ══════════════════════════════════════════════════════════════════════
      dialog-background-color: "rgba(3, 6, 18, 0.94)"       # Noir bleu très sombre
      mdc-dialog-scrim-color: "rgba(1, 2, 8, 0.90)"         # Voile noir opaque — fond
      mdc-dialog-content-ink-color: "var(--secondary-text-color)" # Lavande — contenu
      mdc-dialog-heading-ink-color: "var(--primary-text-color)"   # Blanc — titre
      ha-dialog-border-radius: "12px"                       # Coins arrondis

      # ══════════════════════════════════════════════════════════════════════
      # BADGES — Petits éléments de statut
      # ══════════════════════════════════════════════════════════════════════
      label-badge-border-color: "var(--state-active-color)" # Violet — bordure
      label-badge-text-color: "var(--primary-text-color)"   # Blanc — texte
      label-badge-red: "var(--error-color)"                 # Rose-rouge — erreur
      label-badge-blue: "var(--accent-color)"               # Cyan — info
      label-badge-green: "var(--success-color)"             # Vert néon — succès
      label-badge-yellow: "var(--warning-color)"            # Orange — avertissement
      label-badge-grey: "var(--disabled-text-color)"        # Bleu ardoise — neutre
      md-sys-color-on-surface: "var(--secondary-text-color)"                # couleur police badges généraux
      # ══════════════════════════════════════════════════════════════════════
      # MARKDOWN — Contenu texte formaté
      # ══════════════════════════════════════════════════════════════════════
      markdown-text-color: "#a8b8d8"                         # Bleu acier clair — texte
      markdown-link-color: "var(--accent-color)"             # Cyan — liens
      markdown-code-background-color: "rgba(var(--rgb-accent-color), 0.12)" # Cyan très translucide

      # ══════════════════════════════════════════════════════════════════════
      # BOUTONS — Interactions primaires
      # ══════════════════════════════════════════════════════════════════════
      ha-button-neutral-color: "var(--primary-color)"        # Violet néon — bouton neutre
      mdc-button-outline-color: "var(--primary-color)"       # Violet néon — bordure
      mdc-button-disabled-ink-color: "var(--disabled-text-color)" # Bleu ardoise — texte désactivé
      mdc-button-disabled-outline-color: "var(--disabled-text-color)" # Bleu ardoise — bordure désactivée
      mdc-text-button-ripple-color: "rgba(var(--rgb-accent-color), 0.25)" # Cyan ripple texte
      mdc-outlined-button-ripple-color: "rgba(var(--rgb-accent-color), 0.25)" # Cyan ripple bordure
      mdc-contained-button-ripple-color: "rgba(var(--rgb-state-active-color), 0.40)" # Violet ripple contenu

      # ══════════════════════════════════════════════════════════════════════
      # CHIPS & TABLES — Listes et données
      # ══════════════════════════════════════════════════════════════════════
      chip-background-color: "rgba(var(--rgb-accent-color), 0.48)"        # Cyan très translucide
