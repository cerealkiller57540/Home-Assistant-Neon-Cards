  heat_pump_bias_afternoon_hc:
    name: "Afternoon HC Boost (°C)"
    min: 0
    max: 2.5
    step: 0.5
    icon: mdi:white-balance-sunny

  heat_pump_bias_post_afternoon_hc:
    name: "Post-Afternoon HC (°C)"
    min: 0
    max: 1
    step: 0.25
    icon: mdi:connection

  heat_pump_room_temp_cutoff:
    name: "HC Nuit - Seuil coupure boost (°C)"
    min: 19
    max: 23
    step: 0.5
    icon: mdi:thermometer-check

  car_battery_min:
    name: "Voiture - Niveau batterie minimum"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-low

  car_battery_max:
    name: "Voiture - Niveau batterie maximum"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-high

  solar_surplus_min:
    name: "Surplus solaire minimum"
    min: 0
    max: 5000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:solar-power

  sonos_night_volume:
    name: "Sonos - Volume nocturne"
    min: 0
    max: 0.20
    step: 0.01
    icon: mdi:volume-low

  compteur_abonnement_edf:
