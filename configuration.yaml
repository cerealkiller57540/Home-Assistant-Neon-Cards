# Loads default set of integrations. Do not remove.
default_config:
homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
  - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421
  - /local/glitch-header.js?v=1

pyscript:
  allow_all_imports: true
  hass_is_global: true

# === TELEGRAM (fallback notifs portail/garage, 2026-06-13) ===
# ⚠️ En HA 2026.6, telegram_bot est config_flow (UI) — PLUS de config YAML.
# Configuré via Paramètres → Appareils & services → Ajouter → Telegram bot.
# Token bot + chat_id restent dans secrets.yaml pour référence. L'entité notify
# créée par le config flow est ciblée dans les automations via son entity_id.

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include templates.yaml
sensor: !include sensor.yaml

# Logging
logger:
  default: warn
  logs:
    custom_components.sunology: critical
    custom_components.sunology-socket: critical
    pyscript.car_charging: warn
    pyscript.pihole_update: warn
    pysmartthings: critical
    custom_components.pyscript: warning
    custom_components.samsungtv_smart.sensor: error
    custom_components.atmofrance.sensor: error
    # 2026-06-05 : token SmartThings expiré → spam x127 "Authentication failed". Museler l'API
    # (à régénérer le token plus tard : account.smartthings.com → PAT → reconfigure l'intégration).
    custom_components.samsungtv_smart.api.smartthings: critical
    custom_components.samsungtv_smart: error
    homeassistant.components.dlna_dmr: error
    homeassistant.helpers.entity: error
    homeassistant.components.media_player: error

# === CAMERAS ===
# 2026-06-05 : bloc camera mjpeg YAML retiré (déprécié → erreur log). La webcam est désormais
