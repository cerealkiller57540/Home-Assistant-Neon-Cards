# === INPUT TEXT ===
input_text:
  heat_agent_last_note:
    name: "Heat Agent - Dernière note"
    max: 255
    icon: mdi:robot

# === INPUT BOOLEAN ===
input_boolean:
  # ==== HEAT PUMP SMART BIAS SWITCHES ====
  heat_pump_smart_bias_enabled:
    name: "Heat Pump Smart Bias Control"
    icon: mdi:brain

  heat_pump_smart_bias_peak_mode:
    name: "Peak/Off-Peak Mode Enabled"
    icon: mdi:clock-time-eight

  # ==== EXISTING SWITCHES ====
  car_smart_charging:
    name: "Charge intelligente voiture"
    icon: mdi:ev-station

  car_solar_charging:
    name: "Charge sur surplus solaire"
    icon: mdi:solar-power-variant

  lights_auto_sunset:
    name: "Lumières auto au coucher du soleil"
    icon: mdi:weather-sunset

  led_effect_active:
    name: Effet LED
    initial: off

  tondeuse_rattrapage_needed:
    name: "Tondeuse - Rattrapage nécessaire"
    icon: mdi:grass

  tondeuse_pause:
    name: "Tondeuse - Pause (herbe sèche/vacances)"
    icon: mdi:pause-circle

  # Armement du retour : passe à ON quand le Pixel entre dans le rayon lointain (~400 m)
  # et redescend à OFF une fois l'ouverture déclenchée près de la maison (~80 m) ou au
  # départ. Sert de "2 rayons auto-temporisés" pour ouvrir portail/garage dans la rue.
  retour_imminent:
    name: "Retour maison imminent"
    icon: mdi:car-arrow-left
    initial: off

  # 2026-06-06 : VERROU partagé portail/garage. Mis à ON au début de toute action
  # (départ / ouverture portail / ouverture garage), remis à OFF après un cooldown de 90 s.
  # Empêche le yo-yo WiFi (Livebox <-> My VW <-> not connected) de rejouer les automations
  # en rafale (constat du 06-06 : ~8 impulsions portail en 4 min, et le RETOUR qui
  # déclenchait le DÉPART à 18:50:39). Verrou PARTAGÉ => départ et retour ne se croisent plus.
  porte_action_en_cours:
    name: "Portail/garage — action en cours (verrou)"
    icon: mdi:lock-clock
    initial: off

  # 2026-06-08 : REFONTE SIMPLE. Flag "vraiment parti en voiture". Posé ON au départ,
  # consommé (remis OFF) au retour. CLÉ anti-faux-retour : le garage/portail ne s'ouvrent
  # au retour QUE si ce flag est ON → un rebond GPS/WiFi (app HA qui se reconnecte,
  # unavailable→home) alors qu'on n'est jamais parti ne peut PLUS ouvrir le garage tout seul
  # (cas vécu 08-06 11:38 : garage ouvert au bureau). Remplace retour_imminent + le verrou.
  parti_en_voiture:
    name: "Parti en voiture"
    icon: mdi:car-arrow-right
    initial: off

