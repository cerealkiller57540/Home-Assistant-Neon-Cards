# === MEDIA PLAYER ===
# 2026-06-05 : ancienne intégration liveboxtvuhd (YAML) RETIRÉE — remplacée par le fork moderne
# liveboxtv_ng (config_flow + UPnP + EPG dynamique, gère .30 ET .63). Bloc archivé dans
# _removed_config_archive.md.

# === RECORDER ===
# Mode exclude — HA enregistre tout par défaut
# On exclut uniquement les entités volumineuses et inutiles
recorder:
  # Historique détaillé court terme (UI/debug). Les statistiques long terme
  # (énergie, agrégats) ne sont JAMAIS purgées, indépendamment de ce réglage.
  # L'analyse empirique du heat_agent ne dépend PAS du recorder : elle vit dans
  # /config/logs/heat_agent_log.jsonl (append pur, conservé à vie).
  # 180 j faisait gonfler la DB à ~8,6 Go -> crash recorder nocturne (2026-06-02).
  # 2026-06-02 : passé à 30 j en urgence (disque plein).
  # 2026-06-02 : partition agrandie à 64 Go -> on relâche la *durée* à 90 j, mais on
  # GARDE toutes les exclusions ci-dessous (c'est le débit ~600k pts/j qui tuait la DB,
  # pas la durée). Surveiller la taille de home-assistant_v2.db après quelques semaines.
  purge_keep_days: 90
  exclude:
    entity_globs:
    - sensor.burthecourt_aux_chenes_forecast_*
    - sensor.sun.*
    - sensor.envoy_122233025824_metering_status_*
    - sensor.envoy_122233025824_meter_status_flags_*
    # ── 2026-06-02 : capteurs très bavards (~600k pts/j) qui gonflaient la DB. ──
    # Exclusions agressives. N'affecte NI la base empirique heat_agent (JSONL),
    # NI les statistiques d'énergie long terme (table `statistics`, jamais purgée),
    # NI la lecture live (state.get reste dispo). L'agent lit conso_linky, pas ces
    # entités. cf [[project-recorder-crash]].
    # Batterie / onduleur (puissance, tension, target power — instantané/seconde)
    - sensor.batp_*
    - sensor.acvoltage_*
    - sensor.targetpow_*
    # Réseau Linky / surplus solaire (puissances instantanées ; les compteurs
    # d'énergie cumulés _energy_* restent historisés via statistics)
    - sensor.edpower_*
    # Onduleur / PV même device : courant DC instantané (bavard, exclu).
    # 2026-06-20 : energycons_* RETIRÉ de l'exclusion — ce sont des compteurs
    # d'ÉNERGIE cumulés (mWh, total) requis par la page Énergie (batterie Storey).
    # L'exclure provoquait l'avertissement "entité non suivie". Faible débit,
    # pas un pollueur DB. cf [[project-recorder-crash]].
    - sensor.dccurrent_*
    # Switch Netgear GS108T (compteurs trafic par port — pur diagnostic réseau)
    - sensor.gs108t_*
    entities:
    # Prises / divers puissance instantanée (l'énergie kWh cumulée reste via statistics)
    - sensor.prise_chambre_power
    - sensor.pc_hydroponie_power
    # 2026-07-18 : ré-historisé à la demande de Chris (sparkline watermark POWER FEED
    # de la card BATTLESTATION voulait une vraie courbe). Surveiller le volume si la DB
    # regonfle, même logique que prod_totale_2 ci-dessous. cf [[project-recorder-crash]],
    # [[project_battlestation_card]].
    # - sensor.prise_pc_puissance
    # 2026-06-05 : ré-historisé à la demande de Chris (courbe production solaire instantanée
    # voulue). Surveiller le volume si la DB regonfle. cf [[project-recorder-crash]].
    # - sensor.prod_totale_2
    # 2026-06-02 : Shelly EM (puissance instantanée, ~241k lignes) — l'énergie kWh
    # cumulée reste via statistics. Identifié comme gros pollueur post-recover DB.
    - sensor.shellyemminig4_d885acef3f88_puissance
    # Diagnostics internes ESP Ecodan (debug, aucun intérêt historique)
    - sensor.ecodan_heatpump_heap_free
    - sensor.ecodan_heatpump_loop_time
    # Ecodan diagnostics
    - sensor.ecodan_heatpump_wifi_signal_db
    - sensor.ecodan_heatpump_wifi_signal
    - sensor.ecodan_heatpump_cpu_0
    - sensor.ecodan_heatpump_cpu_1
    - sensor.ecodan_heatpump_esp_uptime
    - sensor.ecodan_heatpump_esp_internal_temperature
    # Lixee diagnostics/static
    - sensor.lixee_linkquality
    - sensor.lixee_site_id
    - sensor.lixee_ntarf
    - sensor.lixee_pref
    - sensor.lixee_relais
    - sensor.lixee_status_register
    - sensor.lixee_current_tarif
    - sensor.lixee_smaxsn
    - sensor.lixee_smaxsn_1
    # Envoy CT/redundant sensors
    - sensor.envoy_122233025824_production_ct_power
    - sensor.envoy_122233025824_production_ct_energy_delivered
    - sensor.envoy_122233025824_production_ct_energy_received
    - sensor.envoy_122233025824_net_consumption_ct_current
    - sensor.envoy_122233025824_balanced_net_power_consumption
    - sensor.envoy_122233025824_lifetime_balanced_net_energy_consumption
    - sensor.envoy_122233025824_lifetime_net_energy_consumption
    - sensor.envoy_122233025824_lifetime_net_energy_production
    # Zigbee signal
    - sensor.0x98a316fffe752710_linkquality
    # 2026-06-28 : heatmap cyber = HTML pré-rendu ~24 Ko en attributs (grille 24x7),
    # > 16384 o -> le recorder refusait de stocker les attrs et spammait le log toutes
    # les minutes. C'est un capteur d'affichage LIVE (alimenté par MQTT retained,
    # cf cyber_monitor.py sur le Pi .51) : aucun intérêt historique. cf [[project-cyber-zipbomb-tarpit-mqtt]].
    - sensor.cyber_station_heatmap_activite
    # 2026-08-18 : même symptôme, même remède. Liste des IP actives en purgatoire
    # (attribut, alimenté MQTT retained côté Pi .51) dépasse 16384 o -> spam log.
    # Capteur d'affichage LIVE, aucun intérêt historique.
    - sensor.cyber_station_purgatory_ip_actives

mqtt:
  climate:
  - name: "Clim Chambre Control"
    unique_id: "clim_chambre_custom"

    # --- Modes ---
    mode_command_topic: "zigbee2mqtt/Clim Chambre/set"
    mode_command_template: '{"system_mode": "{{ value }}"}'
    mode_state_topic: "zigbee2mqtt/Clim Chambre"
    mode_state_template: "{{ value_json.system_mode }}"
    modes:
    - "off"
    - "heat"
    - "cool"
    - "dry"
    - "fan_only"

    # --- Température ---
    temperature_command_topic: "zigbee2mqtt/Clim Chambre/set"
    temperature_command_template: >-
      {"occupied_{% if state_attr('climate.clim_chambre_control', 'hvac_mode') == 'heat' %}heating{% else %}cooling{% endif %}_setpoint": {{ value }}}

    temperature_state_topic: "zigbee2mqtt/Clim Chambre"
    temperature_state_template: "{% if value_json.system_mode == 'heat' %}{{ value_json.occupied_heating_setpoint | float }}{% else %}{{ value_json.occupied_cooling_setpoint | float }}{% endif %}"

    # --- Température ambiante ---
    current_temperature_topic: "zigbee2mqtt/Clim Chambre"
    current_temperature_template: "{{ value_json.local_temperature | float | round(1) }}"

    # --- Ventilation ---
    fan_mode_command_topic: "zigbee2mqtt/Clim Chambre/set"
    fan_mode_command_template: '{"fan_mode": "{{ value }}"}'
    fan_mode_state_topic: "zigbee2mqtt/Clim Chambre"
    fan_mode_state_template: "{{ value_json.fan_mode }}"
    fan_modes:
    - "off"
    - "low"
    - "medium"
    - "high"
    - "auto"

    # --- Volets (louver) ---
    swing_mode_command_topic: "zigbee2mqtt/Clim Chambre/set"
    swing_mode_command_template: '{"ac_louver_position": "{{ value }}"}'
    swing_mode_state_topic: "zigbee2mqtt/Clim Chambre"
    swing_mode_state_template: "{{ value_json.ac_louver_position }}"
    swing_modes:
    - "fully_open"
    - "fully_closed"
    - "quarter_open"
    - "half_open"
    - "three_quarters_open"

    # --- Paramètres ---
    min_temp: 16
    max_temp: 30
    temp_step: 1
    precision: 0.1
