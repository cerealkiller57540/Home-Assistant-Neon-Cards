- id: smart_heat_pump_bias_control
  alias: "\U0001F9E0 Smart Heat Pump - Dynamic Setpoint Bias"
  description: 'Gestion bias HC/HP pour PAC Ecodan (compatible AA + Smart Boost).
    v6 — Lixee = source de vérité complète HC↔HP. Transitions 00h20, 06h20, 14h20,
    16h20 : double déclenchement horloge + confirmation Lixee (timeout 10min). HC
    Nuit et HC Après-midi ont des réglages de bias distincts.

    '
  triggers:
  - trigger: homeassistant
    event: start
    id: restart
  - trigger: state
    entity_id: sensor.lixee_current_price
    to:
    - HEURE PLEINE
    - HEURE CREUSE
    for:
      seconds: 10
  - trigger: time
    at: 00:20:00
    id: transition_hc_night
  - trigger: time
    at: 06:20:00
    id: transition_hp_morning
  - trigger: time
    at: '14:20:00'
    id: transition_hc_afternoon
  - trigger: time
    at: '16:20:00'
    id: transition_hp_evening
  - trigger: time
    at: 00:00:00
  - trigger: time
    at: 08:00:00
  - trigger: time
    at: '17:00:00'
  - trigger: time
    at: '21:00:00'
  - trigger: time
    at: '23:50:00'
  - trigger: state
    id: manual_adjust
    entity_id:
    - input_number.heat_pump_bias_off_peak
    - input_number.heat_pump_bias_peak
    - input_number.heat_pump_bias_journee
    - input_number.heat_pump_bias_soiree_tardive
    - input_number.heat_pump_bias_pre_offpeak
    - input_number.heat_pump_bias_post_afternoon_hc
    - input_number.heat_pump_bias_afternoon_hc
    - input_number.heat_pump_room_temp_cutoff
    for:
      seconds: 2
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: state
    entity_id: input_boolean.heat_pump_smart_bias_enabled
    state: 'on'
  - condition: template
    value_template: "{{ trigger.id in ['restart', 'transition_hc_night', 'transition_hp_morning',\n
      \                 'transition_hc_afternoon', 'transition_hp_evening']\n   or
      states('sensor.lixee_current_price') in ['HEURE PLEINE', 'HEURE CREUSE'] }}\n"
  actions:
  - if:
    - condition: trigger
      id: restart
    then:
    - action: switch.turn_on
      target:
        entity_id: switch.ecodan_heatpump_server_control_zone_1_prohibit_heating
    - wait_template: "{{ states('sensor.lixee_current_price') in ['HEURE PLEINE',
        'HEURE CREUSE']\n   and has_value('sensor.thermometre_salon_temperature')\n
        \  and has_value('number.ecodan_heatpump_auto_adaptive_setpoint_bias')\n   and
        has_value('sensor.heat_pump_outdoor_temp_fused') }}\n"
      timeout:
        minutes: 10
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.completed }}'
      then:
      - delay:
          minutes: 1
      - action: switch.turn_off
        target:
          entity_id: switch.ecodan_heatpump_server_control_zone_1_prohibit_heating
      else:
      - action: switch.turn_off
        target:
          entity_id: switch.ecodan_heatpump_server_control_zone_1_prohibit_heating
      - action: persistent_notification.create
        data:
          notification_id: pac_demarrage_ha
          title: ⚠️ PAC - Démarrage HA
          message: Capteurs Zigbee non disponibles après 10 min. Chauffage débloqué
            sans correction bias.
  - if:
    - condition: trigger
      id:
      - transition_hc_night
      - transition_hp_morning
      - transition_hc_afternoon
      - transition_hp_evening
    then:
    - variables:
        expected_price: "{% if trigger.id in ['transition_hc_night', 'transition_hc_afternoon']
          %}\n  HEURE CREUSE\n{% else %}\n  HEURE PLEINE\n{% endif %}\n"
    - wait_template: '{{ is_state(''sensor.lixee_current_price'', expected_price)
        }}'
      timeout:
        minutes: 10
      continue_on_timeout: false
    - action: logbook.log
      data:
        name: Heat Pump Smart Control
        message: "\U0001F504 Transition {{ trigger.id }} confirmée par Lixee → {{
          expected_price }}\n"
  - choose:
    - conditions:
      - condition: time
        after: '23:50:00'
        before: '23:59:59'
      sequence:
      - variables:
          target_bias: '{{ (pre_offpeak_ramp | float + humidity_correction | float)
            | round(1) }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F504 Pré-HC Nuit ramp (23h50) → {{ limited_bias|round(1)
            }}°C (hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: time
        after: 00:00:00
        before: 00:20:00
      sequence:
      - variables:
          target_bias: '{{ (pre_offpeak_ramp | float + humidity_correction | float)
            | round(1) }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F504 Pré-HC Nuit ramp (00h00) → {{ limited_bias|round(1)
            }}°C (hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hp }}'
      - condition: time
        after: 05:00:00
        before: 08:00:00
      sequence:
      - variables:
          base_bias: '{% if is_state(''binary_sensor.good_solar_day_expected'', ''on'')
            %} 0.3 {% else %} 0.5 {% endif %}

            '
          target_bias: '{{ (base_bias|float + humidity_correction|float) | round(1)
            }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: switch.turn_off
        target:
          entity_id: switch.ecodan_heatpump_server_control_zone_1_prohibit_heating
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F305 Shoulder matin (Lixee → HP) → {{ limited_bias|round(1)
            }}°C {% if is_state('binary_sensor.good_solar_day_expected','on') %} (bonne
            journée solaire) {% else %} (faible solaire){% endif %} (hum.corr. {{
            '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hc }}'
      - condition: time
        after: 00:20:00
        before: 08:00:00
      sequence:
      - variables:
          room_temp: '{{ states(''sensor.thermometre_salon_temperature'') | float(19)
            }}'
          cutoff: '{{ states(''input_number.heat_pump_room_temp_cutoff'') | float(21)
            }}'
          strategy: '{{ states(''sensor.heat_pump_tomorrow_strategy'') }}'
          adjusted_boost: '{% set b = off_peak_boost %} {% if   strategy == ''Journée
            difficile'' %} {{ b + 0.3 }} {% elif ''Économie'' in strategy          %}
            {{ b - 0.3 }} {% else                                 %} {{ b }} {% endif
            %}

            '
          target_bias: '{% if   room_temp >= cutoff + 0.5 %} 0.0 {% elif room_temp
            >= cutoff        %} {{ (adjusted_boost|float * 0.5 + humidity_correction|float)
            | round(1) }} {% else                            %} {{ (adjusted_boost|float      +
            humidity_correction|float) | round(1) }} {% endif %}

            '
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: switch.turn_off
        target:
          entity_id: switch.ecodan_heatpump_server_control_zone_1_prohibit_heating
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F319 HC Nuit → {% if   room_temp >= cutoff + 0.5 %} Pièce
            chaude ({{ room_temp|round(1) }}°C) → Bias 0 {% elif room_temp >= cutoff
            \       %} Pièce OK → Demi-boost {% else                            %}
            Boost plein {% endif %} {{ limited_bias|round(1) }}°C {% if   strategy
            == 'Journée difficile' %} ❄ (+0.3) {% elif 'Économie' in strategy          %}
            ☀ coast (-0.3) {% elif 'Préchauffage' in strategy      %} \U0001F321 préchauffage
            {% endif %} (hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hc }}'
      - condition: time
        after: '13:00:00'
        before: '18:00:00'
      sequence:
      - variables:
          base_bias: '{{ [hc_afternoon_bias|float, 2.5] | min }}'
          temp_multiplier: '{{ states(''sensor.temperature_advantage_multiplier'')
            | float(1.0) }}

            '
          temp_optimized: '{{ (base_bias|float * temp_multiplier) | round(1) }}'
          defrost_boost: '{% if defrost_risk %} {{ temp_optimized|float + 0.3 }} {%
            else            %} {{ temp_optimized }} {% endif %}

            '
          target_bias: '{{ (defrost_boost|float + humidity_correction|float) | round(1)
            }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: switch.turn_off
        target:
          entity_id: switch.ecodan_heatpump_server_control_zone_1_prohibit_heating
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "☀ HC PM (Lixee → HC) → {{ limited_bias|round(1) }}°C (☁{{ cloud_cover|round(0)
            }}%, ×{{ temp_multiplier }}, hum.corr. {{ '%+.1f'|format(humidity_correction|float)
            }}°C) {% if freeze_risk              %} \U0001F976 Gel! {% elif high_heat_loss
            \        %} \U0001F4A8 Vent fort {% elif poor_solar_conditions  %} ☔ Mauvais
            solaire {% elif defrost_risk           %} ❄ Défrost probable {% else                        %}
            ✓ OK {% endif %}\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hp }}'
      - condition: time
        after: 08:00:00
        before: '14:00:00'
      sequence:
      - variables:
          target_bias: '{{ (journee_bias + humidity_correction|float) | round(1) }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F3E0 Journée HP → {{ limited_bias|round(1) }}°C (coasting,
            hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hp }}'
      - condition: time
        after: '15:00:00'
        before: '17:00:00'
      sequence:
      - variables:
          target_bias: '{{ (post_afternoon_hc|float + humidity_correction|float) |
            round(1) }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F50B Post-HC PM (Lixee → HP) → {{ limited_bias|round(1)
            }}°C (hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hp }}'
      - condition: time
        after: '14:00:00'
        before: '15:00:00'
      sequence:
      - variables:
          base_bias: '{% set high_solar = is_state(''binary_sensor.high_afternoon_solar_expected'',''on'')
            %} {% set potential  = states(''sensor.afternoon_hc_solar_potential'')
            | float(0) %} {% if high_solar and potential > 2 %} 0.8 {% elif potential
            > 1.5            %} 0.6 {% else                            %} 0.5 {% endif
            %}

            '
          target_bias: '{{ (base_bias|float + humidity_correction|float) | round(1)
            }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F504 Pré-HC PM ramp (HP) → {{ limited_bias|round(1) }}°C
            ({{ states('sensor.afternoon_hc_solar_potential')|float|round(1) }}kWh
            attendu, hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hp }}'
      - condition: time
        after: '17:00:00'
        before: '21:00:00'
      sequence:
      - variables:
          target_bias: '{% if room_temp_global < 17.5 %} 0.0 {% else %} {{ (peak_reduction
            + humidity_correction|float) | round(1) }} {% endif %}

            '
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "⚡ Peak hours → {{ limited_bias|round(1) }}°C {% if room_temp_global
            < 17.5 %} \U0001F6A8 Rescue froid ({{ room_temp_global|round(1) }}°C)
            → bias 0 {% else %} (coasting, hum. {{ states('sensor.thermometre_salon_humidity')|round(0)
            }}%, corr. {{ '%+.1f'|format(humidity_correction|float) }}°C) {% endif
            %}\n"
    - conditions:
      - condition: template
        value_template: '{{ is_hp }}'
      - condition: time
        after: '21:00:00'
        before: '23:50:00'
      sequence:
      - variables:
          base_bias: '{% if   room_temp_global < 17.5 %} {{ (off_peak_boost * 0.5)
            | round(1) }} {% elif room_temp_global < 19.0 %} {{ (off_peak_boost *
            0.5) | round(1) }} {% else                         %} {{ soiree_tardive_bias
            | round(1) }} {% endif %}

            '
          target_bias: '{{ (base_bias|float + humidity_correction|float) | round(1)
            }}'
          limited_bias: '{% set delta = (target_bias | float) - current_bias %} {%
            if   delta >  max_bias_change %} {{ current_bias + max_bias_change }}
            {% elif delta < -max_bias_change %} {{ current_bias - max_bias_change
            }} {% else %}                          {{ target_bias }} {% endif %}

            '
      - condition: template
        value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
      - action: number.set_value
        continue_on_error: true
        target:
          entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
        data:
          value: '{{ limited_bias }}'
      - action: logbook.log
        data:
          name: Heat Pump Smart Control
          message: "\U0001F319 Soirée tardive — pièce {{ room_temp_global|round(1)
            }}°C {% if   room_temp_global < 17.5 %} → \U0001F6A8 Rescue froid, demi-boost
            +{{ limited_bias|round(1) }}°C {% elif room_temp_global < 19.0 %} → Sous
            19°C, demi-boost +{{ limited_bias|round(1) }}°C {% else                         %}
            → Confortable, coasting {{ soiree_tardive_bias|round(1) }}°C {% endif
            %} (hum.corr. {{ '%+.1f'|format(humidity_correction|float) }}°C)\n"
    default:
    - variables:
        target_bias: 0
        limited_bias: '{% set delta = (target_bias | float) - current_bias %} {% if   delta
          >  max_bias_change %} {{ current_bias + max_bias_change }} {% elif delta
          < -max_bias_change %} {{ current_bias - max_bias_change }} {% else %}                          {{
          target_bias }} {% endif %}

          '
    - condition: template
      value_template: '{{ (limited_bias | float - current_bias) | abs > 0.05 }}'
    - action: number.set_value
      continue_on_error: true
      target:
        entity_id: number.ecodan_heatpump_auto_adaptive_setpoint_bias
      data:
        value: '{{ limited_bias }}'
    - action: logbook.log
      data:
        name: Heat Pump Smart Control
        message: ✓ Hors créneau / Lixee non disponible. Bias → 0.0°C (AA full control)
  variables:
    is_hc: '{{ is_state(''sensor.lixee_current_price'', ''HEURE CREUSE'') }}'
    is_hp: '{{ is_state(''sensor.lixee_current_price'', ''HEURE PLEINE'') }}'
    off_peak_boost: '{{ states(''input_number.heat_pump_bias_off_peak'')           |
      float(1.5) }}'
    peak_reduction: '{{ states(''input_number.heat_pump_bias_peak'')               |
      float(-1.5) }}'
    pre_offpeak_ramp: '{{ states(''input_number.heat_pump_bias_pre_offpeak'')        |
      float(0.3) }}'
    post_afternoon_hc: '{{ states(''input_number.heat_pump_bias_post_afternoon_hc'')  |
      float(0.2) }}'
    journee_bias: '{{ states(''input_number.heat_pump_bias_journee'')            |
      float(-0.5) }}'
    soiree_tardive_bias: '{{ states(''input_number.heat_pump_bias_soiree_tardive'')     |
      float(-1.0) }}'
    hc_afternoon_bias: '{{ states(''input_number.heat_pump_bias_afternoon_hc'')       |
      float(1.5) }}'
    cloud_cover: '{{ states(''sensor.burthecourt_aux_chenes_cloud_cover'')       |
      float(0) }}'
    freeze_risk: '{{ is_state(''binary_sensor.freeze_risk_expected'', ''on'') }}'
    high_heat_loss: '{{ is_state(''binary_sensor.high_heat_loss_expected'', ''on'')
      }}'
    poor_solar_conditions: '{{ is_state(''binary_sensor.poor_solar_conditions_expected'',
      ''on'') }}'
    defrost_risk: '{{ is_state(''binary_sensor.defrost_likely_soon'', ''on'') }}'
    current_bias: '{{ states(''number.ecodan_heatpump_auto_adaptive_setpoint_bias'')
      | float(0) }}

      '
    room_temp_global: '{{ states(''sensor.thermometre_salon_temperature'') | float(20)
      }}

      '
    humidity_correction: '{% set h = states(''sensor.thermometre_salon_humidity'')
      | float(50) %} {% if   h < 35 %}  0.3 {% elif h < 45 %}  0.1 {% elif h > 65
      %} -0.1 {% else %}         0.0 {% endif %}

      '
    max_bias_change: "{% if trigger is defined and trigger.id == 'manual_adjust' %}\n
      \ 3.0\n{% else %}\n  {% set mins = (now() - states.number.ecodan_heatpump_auto_adaptive_setpoint_bias.last_changed).total_seconds()
      / 60 %}\n  {% if   mins > 90 %} 2.0\n  {% elif mins > 30 %} 1.0\n  {% else            %}
      0.5\n  {% endif %}\n{% endif %}\n"
  mode: restart
- id: '1773561904170'
  alias: "\U0001F321️ Pompe à Chaleur - Synchronisation Température Salon"
  description: Synchronise la température salon (Zigbee principal, BLE tp393 en fallback
    si indisponible) vers le thermostat virtuel Ecodan.
  use_blueprint:
    path: github.com/sync_virtual_thermostat.yaml
    input:
      source_entity: sensor.thermometre_salon_temperature
      source_fallback: sensor.tp393_69fa_temperature
      target_input: number.ecodan_heatpump_virtual_thermostat_input_z1
