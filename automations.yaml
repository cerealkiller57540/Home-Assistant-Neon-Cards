- id: 1769595764303_optimized
  alias: "\U0001F50C Voiture - Charge Heures Creuses (Smart)"
  description: Démarre la charge automatiquement en heures creuses
  triggers:
  - trigger: state
    entity_id: sensor.lixee_current_price
    to: HEURE CREUSE
  conditions:
  - condition: state
    entity_id: input_boolean.car_smart_charging
    state: 'on'
  - condition: state
    entity_id: binary_sensor.wvwzzze18sp049976_charging_cable_connected
    state: 'on'
  - condition: template
    value_template: '{{ states(''sensor.wvwzzze18sp049976_battery_level'') | float(0)
      < states(''input_number.car_battery_max'') | float(80) }}'
  - condition: state
    entity_id: switch.wvwzzze18sp049976_charging
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.wvwzzze18sp049976_charging
  - action: persistent_notification.create
    data:
      notification_id: car_charge
      title: "\U0001F50C Charge Voiture"
      message: Début de charge HC ({{ states('sensor.wvwzzze18sp049976_battery_level')
        }}%)
  - action: switch.turn_on
    target:
      entity_id: switch.wvwzzze18sp049976_force_data_refresh
  mode: single
- id: 1769595822723_optimized
  alias: ⏸ Voiture - Stop Charge Heures Pleines/Batterie Max
  description: Arrête la charge HC en heures pleines, sauf si surplus solaire suffisant
  triggers:
  - trigger: state
    entity_id: sensor.lixee_current_price
    to: HEURE PLEINE
  - trigger: numeric_state
    entity_id: sensor.wvwzzze18sp049976_battery_level
    above: input_number.car_battery_max
  conditions:
  - condition: state
    entity_id: switch.wvwzzze18sp049976_charging
    state: 'on'
  - condition: or
    conditions:
    - condition: trigger
      id:
      - '0'
    - condition: numeric_state
      entity_id: sensor.wvwzzze18sp049976_battery_level
      above: input_number.car_battery_max
  - condition: not
    conditions:
    - condition: numeric_state
      entity_id: sensor.surplus_solaire_moyen_5_min
      above: input_number.solar_surplus_min
  - condition: state
    entity_id: input_boolean.car_smart_charging
    state:
    - 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.wvwzzze18sp049976_charging
  - action: persistent_notification.create
    data:
      notification_id: car_charge
      title: ⏸ Charge Voiture
      message: '{% if trigger.entity_id == ''sensor.wvwzzze18sp049976_battery_level''
        %} Batterie pleine ({{ states(''sensor.wvwzzze18sp049976_battery_level'')
        }}%) {% else %} Fin des heures creuses ({{ states(''sensor.wvwzzze18sp049976_battery_level'')
        }}%) {% endif %}'
  - action: switch.turn_on
    target:
      entity_id: switch.wvwzzze18sp049976_force_data_refresh
- id: 1769596927583_optimized
  alias: ☀ Voiture - Charge Surplus Solaire
