      - delay:
          milliseconds: 10000
      - action: switch.turn_off
        target:
          entity_id: switch.0x98a316fffe752710
  mode: single
- id: depart_ferme_garage
  alias: "\U0001F697 Départ — éloigné >60 m → ferme garage"
  description: '24-06 : le radar ne fonctionnait pas pour fermer (porte ouverte =
    radar mmWave collé ON, jamais ''off'' → le garage restait ouvert toute la journée,
    et ça déclenchait ''Tu es rentré ?'' en se garant ailleurs). On ferme désormais
    le garage sur la position GÉOCODÉE (MAJ ~27 s) dès >60 m du garage — tôt, car
    la porte ne doit pas traîner ouverte. Gardé Android Auto + garage ouvert. Seuil
    60 m < 120 m du portail → le garage ferme avant le portail.'
  triggers:
  - trigger: template
    value_template: '{% set loc = state_attr(''sensor.pixel_9a_geocoded_location'',
      ''location'') %}{{ loc is not none and distance(loc[0], loc[1], 48.582308, 6.248363)
      | float(0) > 0.06 }}'
  conditions:
  - condition: state
    entity_id: binary_sensor.pixel_9a_android_auto
    state: 'on'
  - condition: state
    entity_id: binary_sensor.zigbee_47614_1_contact
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.switch_porte_garage
  - delay:
      milliseconds: 10000
  - action: switch.turn_off
    target:
      entity_id: switch.switch_porte_garage
  mode: single
- id: depart_ferme_garage_camera
  alias: "\U0001F697 Départ — voiture sort du garage (radar) → ferme tôt"
  description: '04-07 : ferme le garage DÈS que la voiture quitte physiquement le
    garage, sans attendre les 60 m. Signal = binary_sensor.detecteur_presence_presence
    (radar garage) qui passe on→off (trace 04-07 : radar off à 07:01:45 = voiture
    sortie ; la porte se refermait à 07:03:26 sur la géoloc, soit ~1min40 trop tard).
    Gardé Android Auto ON (= tu es en voiture, tu pars) + porte garage ouverte. Le
    filet géoloc 60 m (depart_ferme_garage) reste actif si le radar rate.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.detecteur_presence_presence
    from: 'on'
    to: 'off'
  conditions:
  - condition: state
    entity_id: binary_sensor.pixel_9a_android_auto
    state: 'on'
  - condition: state
    entity_id: binary_sensor.zigbee_47614_1_contact
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.switch_porte_garage
  - delay:
      milliseconds: 10000
  - action: switch.turn_off
    target:
      entity_id: switch.switch_porte_garage
  mode: single
- id: depart_ferme_portail
  alias: "\U0001F3E0 Départ — éloigné >120 m → ferme portail"
  triggers:
  - trigger: template
    value_template: "{{ distance('device_tracker.pixel_9a', 48.582308, 6.248363) |
      float(0) > 0.12\n   and state_attr('device_tracker.pixel_9a', 'gps_accuracy')
      | float(999) < 100 }}\n"
    for:
      seconds: 30
  conditions:
  - condition: state
    entity_id: binary_sensor.pixel_9a_android_auto
    state: 'on'
  - condition: state
    entity_id: binary_sensor.0x449fdafffe34178a_contact
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.0x98a316fffe752710
  - delay:
      milliseconds: 10000
  - action: switch.turn_off
    target:
      entity_id: switch.0x98a316fffe752710
  - wait_template: "{{ is_state('binary_sensor.zigbee_47614_1_contact', 'off')\n   and
      is_state('binary_sensor.0x449fdafffe34178a_contact', 'off') }}\n"
    timeout:
      seconds: 90
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.completed }}'
      sequence:
      - action: notify.mobile_app_pixel_9a
        data:
          title: "\U0001F3E0 Maison sécurisée"
          message: Tout est fermé. Bonne route.
          data:
            car_ui: true
            ttl: 0
            priority: high
            channel: Portail Garage
    default:
    - action: notify.mobile_app_pixel_9a
      data:
        title: ⚠️ Attention
        message: 'Pas confirmé fermé : garage={{ states(''binary_sensor.zigbee_47614_1_contact'')
          }}, portail={{ states(''binary_sensor.0x449fdafffe34178a_contact'') }}.'
        data:
          car_ui: true
          ttl: 0
          priority: high
          channel: Portail Garage
  mode: single
- id: retour_maison_notif_test
  alias: "\U0001F3E0 Retour — approche 800 m → ouvre portail"
  description: '24-06 : passé sur la position GÉOCODÉE (attribut location, MAJ ~27
    s tout le trajet) au lieu de device_tracker (qui sautait de 424 m direct à la
    maison avec 63 s de trou → 0 anticipation). Seuil élargi 400→800 m. Gardé par
    Android Auto (= en voiture) donc le jitter géocode à l''arrêt ne peut rien ouvrir.
    Si on ne fait que traverser, il se referme à l''éloignement (depart_ferme_portail
    >120 m).'
  triggers:
  - trigger: template
    value_template: '{% set loc = state_attr(''sensor.pixel_9a_geocoded_location'',
      ''location'') %}{{ loc is not none and distance(loc[0], loc[1], 48.582308, 6.248363)
      | float(9999) < 0.80 }}'
  conditions:
  - condition: state
    entity_id: binary_sensor.pixel_9a_android_auto
    state: 'on'
  - condition: state
    entity_id: binary_sensor.0x449fdafffe34178a_contact
    state: 'off'
    for:
      seconds: 45
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.0x98a316fffe752710
  - delay:
      milliseconds: 10000
  - action: switch.turn_off
    target:
      entity_id: switch.0x98a316fffe752710
  - action: notify.mobile_app_pixel_9a
    data:
      title: "\U0001F3E0 Portail"
      message: Portail ouvert.
      data:
        car_ui: true
        ttl: 0
        priority: high
        channel: Portail Garage
  - action: switch.turn_off
    target:
      entity_id:
      - switch.driveway_auto_retour_au_point_de_garde
      - switch.driveway_suivi_automatique
  - action: select.select_option
    target:
      entity_id: select.exterieur_driveway_pre_reglage_ptz
    data:
      option: retour
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.zigbee_47614_1_contact
      from: 'off'
      to: 'on'
    timeout:
      minutes: 5
    continue_on_timeout: true
  - action: switch.turn_on
    target:
      entity_id:
      - switch.driveway_auto_retour_au_point_de_garde
      - switch.driveway_suivi_automatique
  - action: button.press
    target:
      entity_id: button.driveway_retour_au_point_de_garde
  mode: single
- id: retour_maison_ouverture_garage
  alias: "\U0001F697 Ouverture garage au retour"
  description: 'RETOUR 2/3 — Ouvre le GARAGE à l''approche. 04-07 : passé sur la CAMÉRA
    driveway (la géoloc ne gère plus que le portail). Trigger = binary_sensor.driveway_vehicule
    off→on : la caméra te voit entrer dans l''allée après le portail franchi (trace
    04-07 : CAM véhicule on à 12:31:46, porte s''ouvre 8 s après, avant d''arriver
    au garage). 05-07 FIX faux positifs : 2 réouvertures fantômes (12:44 et 12:55)
    car AA restait ''on'' pendant que Chris manœuvrait/repartait après être rentré
    → chaque flash caméra rouvrait. Ajout garde « en APPROCHE » : device_tracker PAS
    home) + AA on + anti-rafale garage fermé 120 s. ⚠️ 05-07 PREUVE LOGBOOK : le garage
    s''est ouvert à 12:55:38 alors que Chris était à HOUDEMONT (~15 km, en route vers
    Commercy) — un flash driveway_vehicule (voiture qui passe dans la rue) + AA encore
    on tout le trajet (12:41→13:34) a suffi. La garde « not_home » ne bloque RIEN
    ici (il ÉTAIT not_home). ⇒ AJOUT CONDITION DÉCISIVE : distance géocodée < 300
    m du garage (loc = state_attr geocoded_location). La caméra ne peut plus ouvrir
    que si Chris est réellement dans le coin. Retiré door.is_open (UI, contradictoire).'
  triggers:
  - trigger: state
    entity_id: binary_sensor.driveway_vehicule
    from: 'off'
    to: 'on'
    id: cam_vehicule
  conditions:
  - condition: template
    value_template: '{% set loc = state_attr(''sensor.pixel_9a_geocoded_location'',
      ''location'') %}{{ loc is not none and distance(loc[0], loc[1], 48.582308, 6.248363)
      | float(9999) < 0.30 }}'
  - condition: state
    entity_id: binary_sensor.pixel_9a_android_auto
    state: 'on'
  - condition: state
    entity_id: binary_sensor.zigbee_47614_1_contact
    state: 'off'
    for:
      seconds: 120
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.switch_porte_garage
  - delay:
      milliseconds: 10000
  - action: switch.turn_off
    target:
      entity_id: switch.switch_porte_garage
  - action: notify.mobile_app_pixel_9a
    data:
      title: "\U0001F697 Garage"
      message: Garage ouvert, bienvenue.
      data:
        car_ui: true
        ttl: 0
        priority: high
        channel: Portail Garage
  mode: single
- id: retour_demande
  alias: "\U0001F697 Retour — moteur coupé au garage → 'Tu es rentré ?'"
  description: '08-06 FIX : se déclenche sur Android Auto qui se COUPE (= tu viens
