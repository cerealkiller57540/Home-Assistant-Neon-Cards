        temp_ext }} °C</div></td></tr></table></td></tr> <tr><td style=\"padding:24px
        32px 8px 32px;\" align=\"center\"> <a href=\"http://192.168.1.60:8123\" style=\"display:inline-block;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;text-decoration:none;font-size:15px;font-weight:600;padding:14px
        34px;border-radius:12px;\">Ouvrir Home Assistant</a></td></tr> <tr><td style=\"padding:18px
        32px 28px 32px;text-align:center;\"> <div style=\"color:#5b6573;font-size:12px;\">Détecté
        par le capteur de vibrations · {{ date_fr }}</div> <div style=\"color:#3d4654;font-size:11px;margin-top:4px;\">Home
