- id: '1788436885087'
  alias: "\U0001F32C️ Sensibilité vibration dynamique (vent)"
  description: 'Ajuste number.capteur_vibrations_sensitivity selon sensor.burthecourt_aux_chenes_wind_speed.
    40 au calme (<=5 km/h), dégressif linéaire jusqu''à 32 à 20 km/h+. Plancher remonté
    à 32 (au lieu de 25) : le capteur est un sleepy device Zigbee qui n''applique
    le set_value qu''à son prochain réveil (vibration) -- un plancher trop bas réduit
    les réveils et peut bloquer durablement la sensibilité basse, sans retour possible
    à 40. Complète le fix de la condition vent de automation.alerte_courrier (wind_gust
    mort -> wind_speed).

    '
  triggers:
  - trigger: state
    entity_id:
    - sensor.burthecourt_aux_chenes_wind_speed
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - variables:
      vent: '{{ states(''sensor.burthecourt_aux_chenes_wind_speed'') | float(0) }}'
      cible: '{{ 40 if vent <= 5 else (32 if vent >= 20 else (40 - (vent - 5) * (8
        / 15)) | round(0)) }}'
  - condition: template
    value_template: '{{ (states(''number.capteur_vibrations_sensitivity'') | float(0))
      != (cible | float) }}'
  - action: number.set_value
    target:
      entity_id: number.capteur_vibrations_sensitivity
    data:
      value: '{{ cible }}'
  mode: single
