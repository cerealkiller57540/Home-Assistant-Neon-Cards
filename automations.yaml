- id: depart_ouvre
  alias: "\U0001F697 Départ — Oui → ouvre garage + portail"
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: DEPART_OUI
  - trigger: event
    event_type: telegram_callback
    event_data:
