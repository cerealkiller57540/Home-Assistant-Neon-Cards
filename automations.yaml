      entity_id:
      - light.floor_lamp_basic_2
      - light.leds_salon
- id: '1775318690534'
  alias: ❄️ Clim Chambre - Gestion ouverture porte
  description: Coupe la clim si porte ouverte 5min, relance si elle était allumée
  triggers:
  - entity_id: binary_sensor.ouverture_porte_fenetre_contact
    to: 'on'
    id: porte_ouverte
    trigger: state
    for:
      minutes: 5
  - entity_id: binary_sensor.ouverture_porte_fenetre_contact
    to: 'off'
    id: porte_fermee
    trigger: state
    for:
      minutes: 10
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: porte_ouverte
      - condition: state
        entity_id: binary_sensor.clim_chambre_en_marche
        state: 'on'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.clim_chambre_etat_avant
        data:
          value: '{% set m = states(''climate.clim_chambre_control'') %} {{ m if m
            not in [''off'', ''unknown'', ''unavailable''] else ''cool'' }}'
      - action: climate.turn_off
        target:
          entity_id: climate.clim_chambre_control
    - conditions:
      - condition: trigger
        id: porte_fermee
      - condition: not
        conditions:
        - condition: state
          entity_id: input_text.clim_chambre_etat_avant
          state: 'off'
      - condition: state
        entity_id: binary_sensor.clim_chambre_en_marche
        state: 'off'
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.clim_chambre_control
        data:
          hvac_mode: '{{ states(''input_text.clim_chambre_etat_avant'') }}'
      - action: input_text.set_value
        target:
          entity_id: input_text.clim_chambre_etat_avant
        data:
          value: 'off'
  mode: single
- id: '1775496079688'
  alias: "\U0001F4A1 Salon - Allumage 23h15"
  description: Allume la lumière d'ambiance du salon à 23h15 avec une luminosité de
    30%.
  triggers:
  - trigger: time
    at: '23:15:00'
  conditions: []
  actions:
  - action: light.turn_on
    data:
      rgb_color:
      - 100
      - 0
      - 180
      brightness_pct: 8
    target:
      entity_id: light.leds_cuisine
  - action: light.turn_on
    target:
      entity_id: light.leds_salon
    data:
      brightness_pct: 8
      rgb_color:
      - 100
      - 0
      - 180
  mode: single
- id: '1775600957034'
  alias: "\U0001F4A1 Cascades LEDs - Cuisine & Salon"
  description: Gère l'allumage et l'extinction en cascade pour les deux zones
  triggers:
  - trigger: state
    entity_id: light.leds_cuisine
    from: 'off'
    to: 'on'
    id: cuisine_on
  - trigger: state
    entity_id: light.leds_cuisine
    from: 'on'
    to: 'off'
    id: cuisine_off
  - trigger: state
    entity_id: light.leds_salon
    from: 'off'
    to: 'on'
    id: salon_on
  - trigger: state
    entity_id: light.leds_salon
    from: 'on'
    to: 'off'
    id: salon_off
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: cuisine_on
      sequence:
      - repeat:
          for_each:
          - light.smart_led_bulb_1
          - light.smart_led_bulb_2_2
          - light.smart_led_bulb_3
          - light.smart_led_bulb_4
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ repeat.item }}'
            data:
              rgb_color: '{{ state_attr(trigger.entity_id, ''rgb_color'') | default([255,255,255])
                }}'
              brightness: '{{ state_attr(trigger.entity_id, ''brightness'') | int(204)
                }}'
              transition: 1
          - delay:
              milliseconds: 400
    - conditions:
      - condition: trigger
        id: cuisine_off
      sequence:
      - repeat:
          for_each:
          - light.smart_led_bulb_4
          - light.smart_led_bulb_3
          - light.smart_led_bulb_2_2
          - light.smart_led_bulb_1
          sequence:
          - action: light.turn_off
            target:
              entity_id: '{{ repeat.item }}'
          - delay:
              milliseconds: 400
    - conditions:
      - condition: trigger
        id: salon_on
      sequence:
      - repeat:
          for_each:
          - light.smart_led_bulb_2
          - light.smart_led_bulb
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ repeat.item }}'
            data:
              rgb_color: '{{ state_attr(trigger.entity_id, ''rgb_color'') | default([255,255,255])
                }}'
              brightness: '{{ state_attr(trigger.entity_id, ''brightness'') | int(204)
                }}'
              transition: 1
          - delay:
              milliseconds: 400
    - conditions:
      - condition: trigger
        id: salon_off
      sequence:
      - repeat:
          for_each:
          - light.smart_led_bulb
          - light.smart_led_bulb_2
          sequence:
          - action: light.turn_off
            target:
              entity_id: '{{ repeat.item }}'
          - delay:
              milliseconds: 400
  mode: parallel
- id: '1776624031101'
  alias: "\U0001F33F Robot Tondeuse - Rue + Jardin"
  description: Tonte zones Rue (#1) + Zone3 (#3) à 12h si météo OK et ≥3 jours depuis
    dernière tonte
  triggers:
  - platform: time
    at: '12:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.tondeuse_pause
    state: 'off'
  - condition: template
    value_template: '{{ (now().date() - (states(''input_datetime.tondeuse_derniere_tonte'')
      | as_datetime | as_local).date()).days >= 3 }}

      '
  - condition: state
    entity_id: lawn_mower.mova_1000
    state: docked
  - condition: numeric_state
    entity_id: sensor.burthecourt_aux_chenes_daily_precipitation
    below: 5
  - condition: template
    value_template: "{{ states('sensor.burthecourt_aux_chenes_daily_original_condition')
      not in [\n  'Averses faibles', 'Averses', 'Averses fortes',\n  'Pluie faible',
      'Pluie', 'Pluie forte',\n  'Orages', 'Orages forts', 'Brouillard'\n] }}\n"
  - condition: template
    value_template: "{{ state_attr('sensor.54_weather_alert', 'Canicule') not in ['Orange',
      'Rouge']\n   and state_attr('sensor.54_weather_alert', 'Orages') not in ['Orange',
      'Rouge'] }}\n"
  - condition: numeric_state
    entity_id: sensor.temperature_exterieure
    below: 28
    above: 10
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tondeuse_rattrapage_needed
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.tondeuse_derniere_tonte
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
  - action: persistent_notification.create
    data:
      notification_id: tondeuse
      title: "\U0001F33F Tondeuse"
      message: Tonte démarrée (Rue + Zone3)
  - action: dreame_mower.start_zone_mowing
    target:
      entity_id: lawn_mower.mova_1000
    data:
      zone_ids:
      - 3
      - 1
  - wait_template: '{{ is_state(''lawn_mower.mova_1000'', ''docked'') }}'
    timeout: 04:00:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: state
        entity_id: lawn_mower.mova_1000
        state: docked
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: tondeuse
          title: "\U0001F33F Tondeuse"
          message: Tonte terminée ✅
    - conditions:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: tondeuse
          title: "\U0001F33F Tondeuse"
          message: ⚠️ Tonte timeout (>4h) — vérifier l'état du robot
  mode: single
- id: tondeuse_flag_rattrapage
  alias: "\U0001F33F Robot Tondeuse - Marquer rattrapage nécessaire"
  description: Met le flag rattrapage si météo mauvaise et ≥3 jours depuis dernière
    tonte
  triggers:
  - trigger: time
    at: '12:00:00'
  conditions:
  - condition: template
    value_template: '{{ (now().date() - (states(''input_datetime.tondeuse_derniere_tonte'')
      | as_datetime | as_local).date()).days >= 3 }}

      '
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: sensor.burthecourt_aux_chenes_next_rain
        state: unknown
    - condition: template
      value_template: "{{ states('sensor.burthecourt_aux_chenes_daily_original_condition')
        in [\n  'Averses faibles', 'Averses', 'Averses fortes',\n  'Pluie faible',
        'Pluie', 'Pluie forte',\n  'Orages', 'Orages forts', 'Brouillard'\n] }}\n"
    - condition: numeric_state
      entity_id: sensor.burthecourt_aux_chenes_daily_precipitation
      above: 5
    - condition: template
      value_template: "{{ state_attr('sensor.54_weather_alert', 'Canicule') in ['Orange',
        'Rouge']\n   or state_attr('sensor.54_weather_alert', 'Orages') in ['Orange',
        'Rouge'] }}\n"
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.tondeuse_rattrapage_needed
  mode: single
- id: tondeuse_rattrapage_meteo
  alias: "\U0001F33F Robot Tondeuse - Rattrapage météo"
  description: Déclenche la tonte dès que météo OK si rattrapage nécessaire (hors
    créneaux habituels)
  triggers:
  - platform: state
    entity_id: sensor.burthecourt_aux_chenes_daily_original_condition
  - platform: numeric_state
    entity_id: sensor.burthecourt_aux_chenes_daily_precipitation
    below: 5
  conditions:
  - condition: state
    entity_id: input_boolean.tondeuse_pause
    state: 'off'
  - condition: state
    entity_id: input_boolean.tondeuse_rattrapage_needed
    state: 'on'
  - condition: state
    entity_id: lawn_mower.mova_1000
    state: docked
  - condition: template
    value_template: "{{ states('sensor.burthecourt_aux_chenes_daily_original_condition')
      not in [\n  'Averses faibles', 'Averses', 'Averses fortes',\n  'Pluie faible',
      'Pluie', 'Pluie forte',\n  'Orages', 'Orages forts', 'Brouillard'\n] }}\n"
  - condition: numeric_state
    entity_id: sensor.burthecourt_aux_chenes_daily_precipitation
    below: 5
  - condition: numeric_state
    entity_id: sensor.temperature_exterieure
    below: 28
    above: 10
  - condition: template
    value_template: "{{ state_attr('sensor.54_weather_alert', 'Canicule') not in ['Orange',
      'Rouge']\n   and state_attr('sensor.54_weather_alert', 'Orages') not in ['Orange',
      'Rouge'] }}\n"
  - condition: time
    after: 09:00:00
    before: '20:00:00'
  - condition: not
    conditions:
    - condition: time
      weekday:
      - mon
      - wed
      - sat
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.tondeuse_rattrapage_needed
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.tondeuse_derniere_tonte
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
  - action: persistent_notification.create
    data:
      notification_id: tondeuse
      title: "\U0001F33F Tondeuse"
      message: Rattrapage météo — tonte démarrée
  - action: dreame_mower.start_zone_mowing
    target:
      entity_id: lawn_mower.mova_1000
    data:
      zone_ids:
      - 3
      - 1
  - wait_template: '{{ is_state(''lawn_mower.mova_1000'', ''docked'') }}'
    timeout: 08:00:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: state
        entity_id: lawn_mower.mova_1000
        state: docked
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: tondeuse
          title: "\U0001F33F Tondeuse"
          message: Rattrapage terminé ✅
    - conditions:
      - condition: template
