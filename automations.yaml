  alias: "\U0001F3A5 Driveway - Mini-clip sur détection (personne/animal)"
  description: Enregistre un clip de ~14s (4s avant + 10s) dans media/driveway si
    personne détectée ; enregistre en clips de 10s chaînés tant que binary_sensor.driveway_animal
    reste actif si animal détecté, puis notifie
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.driveway_personne
    - binary_sensor.driveway_animal
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ kind == ''animal'' }}'
      sequence:
      - repeat:
          while:
          - condition: state
            entity_id: binary_sensor.driveway_animal
            state: 'on'
          sequence:
          - action: camera.record
            target:
              entity_id: camera.driveway_net
            data:
              filename: /media/driveway/{{ fname }}_p{{ repeat.index }}.mp4
              duration: 20
              lookback: '{{ 4 if repeat.index == 1 else 2 }}'
    default:
    - action: camera.record
      target:
        entity_id: camera.driveway_fluide
      data:
        filename: /media/driveway/{{ fname }}.mp4
        duration: 10
        lookback: 4
    - delay: 00:00:15
  - action: persistent_notification.create
    data:
      notification_id: driveway_clip
      title: "\U0001F3A5 Clip {{ kind }} enregistré"
      message: Allée — {{ kind }} à {{ now().strftime('%H:%M:%S') }}. Clip dispo dans
        [Médias](/media-browser).
  variables:
    kind: '{% if trigger.entity_id == ''binary_sensor.driveway_personne'' %}personne{%
      else %}animal{% endif %}'
    stamp: '{{ now().strftime(''%Y%m%d_%H%M%S'') }}'
    fname: driveway_{{ kind }}_{{ stamp }}
  mode: single
  max_exceeded: silent
- id: '1769700000004'
  alias: "\U0001F9F9 Driveway - Purge clips 48h"
  description: Supprime chaque jour les clips de media/driveway plus vieux que 48h
    (service pyscript.driveway_cleanup)
  triggers:
  - trigger: time
    at: 04:30:00
  conditions: []
  actions:
  - action: pyscript.driveway_cleanup
  mode: single
- id: '1769700000005'
  alias: "\U0001F6F0️ Driveway - Alerte caméra HS (brouillage WiFi ?)"
  description: Si la caméra Driveway devient injoignable >2 min (coupure ou jammer
    WiFi), alerte via Telegram (canal hors-WiFi)
  triggers:
  - trigger: state
    entity_id: camera.driveway_fluide
    to: unavailable
    for:
      minutes: 2
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.maison_maison_chris
    data:
      message: '⚠️ Caméra ALLÉE injoignable depuis 2 min ({{ now().strftime(''%H:%M:%S'')
        }}). Coupure WiFi/courant ou brouillage possible. Dernier signal connu : {{
        states(''sensor.driveway_signal_wi_fi'') }} dBm.'
  mode: single
- id: '1769700000006'
  alias: ✅ Driveway - Caméra de nouveau en ligne
  description: Confirme via Telegram quand la caméra Driveway redevient joignable
    après une coupure
  triggers:
  - trigger: state
    entity_id: camera.driveway_fluide
    from: unavailable
  conditions: []
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.maison_maison_chris
    data:
      message: '✅ Caméra ALLÉE de nouveau en ligne ({{ now().strftime(''%H:%M:%S'')
        }}). Signal : {{ states(''sensor.driveway_signal_wi_fi'') }} dBm.'
  mode: single
- id: '1783110540450'
  alias: "\U0001F50A Sonos - Allumage auto apres extinction TV"
  description: SONOS - Allumage auto apres extinction TV
  triggers:
  - trigger: state
    entity_id:
    - switch.samsung_55_oled_power
    to:
    - 'off'
    from:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - trigger: media_player.turned_off
    target:
      entity_id: media_player.decodeur_tv_uhd_3
    options:
      behavior: each
      for: 00:00:00
  conditions:
  - condition: time
    after: '22:00:00'
    before: 02:00:00
  actions:
  - action: media_player.media_play
    metadata: {}
    target:
      device_id: a44ba2ea7952c7beb3f6f0c98bf1186c
    data: {}
  mode: single
- id: '1779700000001'
  alias: "\U0001F6A8 Freezer - Alerte Panne"
  description: Alerte Telegram si le congélateur signale une panne/déconnexion, un
    problème matériel, ou une température > -15°C pendant 30 min.
  triggers:
  - trigger: state
    entity_id: sensor.freezer
    to:
    - not_connected
    - failure
    - service
    for:
      minutes: 5
    id: etat
  - trigger: state
    entity_id: binary_sensor.freezer_probleme
    to: 'on'
    for:
      minutes: 2
    id: probleme
  - trigger: numeric_state
    entity_id: sensor.freezer_temperature
    above: -15
    for:
      minutes: 30
    id: temperature
  conditions: []
  actions:
  - variables:
      cause: '{% if trigger.id == "etat" %}État appareil : {{ states("sensor.freezer")
        }}{% elif trigger.id == "probleme" %}Problème matériel signalé par le congélateur{%
        else %}Température trop haute : {{ states("sensor.freezer_temperature") }}°C
        depuis 30 min (consigne {{ state_attr("climate.freezer", "temperature") }}°C){%
        endif %}'
  - action: notify.send_message
    target:
      entity_id: notify.maison_maison_chris
    data:
      message: "\U0001F6A8 Congélateur : possible panne ({{ now().strftime('%H:%M')
        }}). {{ cause }}."
  mode: single
- id: '1784714870965'
  alias: "\U0001F4A1 Couloir - Lumière (Présence)"
  description: Allume la lumière du couloir lors de la détection de présence et l'éteint
    dès que la zone est libre.
  triggers:
  - trigger: state
    entity_id: binary_sensor.detecteur_couloir_chambre_occupancy
  conditions:
  - condition: illuminance.is_value
    target:
      entity_id: sensor.capteur_temperature_capteur_de_luminosite_luminance
    options:
      behavior: any
      for:
        hours: 0
        minutes: 2
        seconds: 0
      threshold:
        type: below
        value:
          active_choice: number
          number: 500
    enabled: true
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.detecteur_couloir_chambre_occupancy
      state: 'on'
    then:
    - action: light.turn_on
      target:
        entity_id: light.leds_couloir
      data:
        transition: 1
    else:
    - condition: state
      entity_id: binary_sensor.detecteur_couloir_chambre_occupancy
      state: 'off'
    - action: light.turn_off
      target:
        entity_id: light.leds_couloir
      data:
        transition: 2
  mode: restart
- id: '1787858340899'
