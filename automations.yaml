- id: hp_notify_states
  alias: "\U0001F514 Heat Pump - Alertes État (Booster / Lockout / Gel)"
  description: 'Notifications persistantes pour booster actif, short cycle lockout
    et risque de gel. Dismiss automatique à la résolution.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.ecodan_heatpump_booster_heater
    id: booster
  - trigger: state
    entity_id: binary_sensor.ecodan_heatpump_short_cycle_lockout
    id: lockout
  - trigger: state
    entity_id: binary_sensor.freeze_risk_expected
    id: gel
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: booster
      - condition: state
        entity_id: binary_sensor.ecodan_heatpump_booster_heater
        state: 'on'
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: hp_booster_active
          title: "\U0001F525 Booster électrique actif"
          message: 'La résistance d''appoint est active depuis {{ now().strftime(''%H:%M'')
            }}. Consommation élevée — vérifier les conditions extérieures.

            '
    - conditions:
      - condition: trigger
        id: booster
      - condition: state
        entity_id: binary_sensor.ecodan_heatpump_booster_heater
        state: 'off'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: hp_booster_active
    - conditions:
      - condition: trigger
        id: lockout
      - condition: state
        entity_id: binary_sensor.ecodan_heatpump_short_cycle_lockout
        state: 'on'
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: hp_short_cycle_lockout
          title: "\U0001F512 Short cycle lockout"
          message: 'Verrouillage court-cycle déclenché à {{ now().strftime(''%H:%M'')
            }}. La PAC est temporairement bloquée. Fréquence compresseur: {{ states(''sensor.ecodan_heatpump_compressor_frequency'')
            | round(0) }}Hz

            '
    - conditions:
      - condition: trigger
        id: lockout
      - condition: state
        entity_id: binary_sensor.ecodan_heatpump_short_cycle_lockout
        state: 'off'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: hp_short_cycle_lockout
      - action: persistent_notification.create
        data:
          notification_id: hp_short_cycle_lockout
          title: ✅ Lockout PAC levé
          message: Short cycle lockout terminé à {{ now().strftime('%H:%M') }}.
    - conditions:
      - condition: trigger
        id: gel
      - condition: state
        entity_id: binary_sensor.freeze_risk_expected
        state: 'on'
      sequence:
      - action: persistent_notification.create
        data:
          notification_id: hp_freeze_risk
          title: "\U0001F976 Risque de gel détecté"
          message: 'Risque de gel à {{ now().strftime(''%H:%M'') }}. Ext: {{ states(''sensor.heat_pump_outdoor_temp_fused'')
            | round(1) }}°C · Chance gel: {{ states(''sensor.burthecourt_aux_chenes_freeze_chance'')
            | round(0) }}% · Vérifier que la PAC est en mode protection.

            '
    - conditions:
      - condition: trigger
        id: gel
      - condition: state
        entity_id: binary_sensor.freeze_risk_expected
        state: 'off'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: hp_freeze_risk
  mode: queued
  max: 10
- id: hp_notify_errors
  alias: "\U0001F514 Heat Pump - Alertes Erreurs Capteurs"
  description: 'Vérifie toutes les 15 min que les capteurs critiques sont disponibles.
    Notifie et crée une notification persistante si problème. Dismiss automatique
    quand tout est revenu.

    '
  triggers:
  - trigger: time_pattern
    minutes: /15
  variables:
    thermo_ok: '{{ not is_state(''sensor.thermometre_salon_temperature'', ''unavailable'')
      and not is_state(''sensor.thermometre_salon_temperature'', ''unknown'') }}'
    bias_ok: '{{ not is_state(''number.ecodan_heatpump_auto_adaptive_setpoint_bias'',
      ''unavailable'') and not is_state(''number.ecodan_heatpump_auto_adaptive_setpoint_bias'',
      ''unknown'') }}'
    outdoor_ok: '{{ not is_state(''sensor.heat_pump_outdoor_temp_fused'', ''unavailable'')
      and not is_state(''sensor.heat_pump_outdoor_temp_fused'', ''unknown'') }}'
    all_ok: '{{ thermo_ok and bias_ok and outdoor_ok }}'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ not all_ok }}'
      sequence:
      - variables:
          error_list: '{% set errors = [] %} {% if not thermo_ok %}{% set errors =
            errors + [''❌ Thermomètre salon indisponible''] %}{% endif %} {% if not
            bias_ok %}{% set errors = errors + [''❌ Capteur bias PAC indisponible'']
            %}{% endif %} {% if not outdoor_ok %}{% set errors = errors + [''❌ Sonde
            température extérieure indisponible''] %}{% endif %} {{ errors | join(''\n'')
            }}

            '
      - action: persistent_notification.create
        data:
          notification_id: hp_sensor_error
          title: ⚠️ Erreur capteur PAC
          message: 'Capteur(s) critique(s) indisponible(s) à {{ now().strftime(''%H:%M'')
            }}:

            {{ error_list }}

            L''automation Smart Bias peut ne pas fonctionner correctement.

            '
      - action: persistent_notification.create
        data:
          notification_id: hp_sensor_error
          title: ⚠️ Erreur capteur PAC
          message: '{{ error_list }}'
    - conditions:
      - condition: template
        value_template: '{{ all_ok }}'
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: hp_sensor_error
  mode: single
- id: '1774337561905'
  alias: "\U0001F50A Sonos - Playlist"
  description: Lance une playlist aléatoire avec minuteur de veille et fondu des lumières
    quand la musique est lancée la nuit
  triggers:
  - device_id: a44ba2ea7952c7beb3f6f0c98bf1186c
    domain: media_player
    entity_id: 4250b159aa86eda74c1d54f308e53fc8
    type: playing
    trigger: device
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions:
  - condition: template
    value_template: '{{ (now() - state_attr(''automation.sonos_minuteur_de_veille_lecture'',
      ''last_triggered'')).seconds > 10 }}

      '
  - condition: time
    after: '22:00:00'
    before: 02:00:00
  actions:
  - alias: Run playlist
    action: media_player.play_media
    target:
      entity_id: media_player.chambre
    data:
      media:
        media_content_id: '{% set ids = [''FV:2/6'', ''FV:2/19'', ''FV:2/17''] %}
          {{ ids[now().microsecond % ids | length] }}

          '
        media_content_type: favorite_item_id
  - action: media_player.shuffle_set
    target:
      device_id: a44ba2ea7952c7beb3f6f0c98bf1186c
    data:
      shuffle: true
  - variables:
      sleep_duration: 7200
      brightness_start: '{{ state_attr(''light.chambre'', ''brightness'') | int(255)
        }}'
      steps: 120
  - action: sonos.set_sleep_timer
    target:
      device_id: a44ba2ea7952c7beb3f6f0c98bf1186c
    data:
      sleep_time: '{{ sleep_duration }}'
  - action: media_player.volume_set
    target:
      device_id: a44ba2ea7952c7beb3f6f0c98bf1186c
    data:
      volume_level: 0.08
  - repeat:
      count: '{{ steps }}'
      sequence:
      - delay:
          seconds: '{{ (sleep_duration / steps) | int }}'
      - action: light.turn_on
        target:
          entity_id: light.chambre
        data:
          brightness: '{{ [((brightness_start - (brightness_start / steps * repeat.index))
            | int), 1] | max }}

            '
  - action: light.turn_off
    target:
      entity_id: light.chambre
  mode: single
- id: '1774986409455'
  alias: "\U0001F305 Chambre - Réveil effet Morning"
  description: Allume la chambre en effet Morning au réveil
  triggers:
  - trigger: state
    entity_id: media_player.chambre
